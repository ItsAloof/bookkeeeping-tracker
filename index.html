const hashNums = nums => compressNums(nums).split(', ').map(x => '#' + x).join(', ');
const fmtMonthsLong = (ms, y) => {
  const s = [...ms].sort((a, b) => a - b), out = [];
  for (let i = 0; i < s.length; i++) {
    let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++;
    out.push(j > i ? `${MONTHS_LONG[s[i]]}–${MONTHS_LONG[s[j]]}` : MONTHS_LONG[s[i]]);
    i = j;
  }
  return out.join(', ') + (y ? ` ${y}` : '');
};

/** Everything a report could say about one client, as data. */
function collectReport(cid, year, through) {
  const c = one('SELECT * FROM clients WHERE id = ?', [cid]);
  const map = periodMap(year, cid);
  const tISO = todayISO();
  const accounts = getAccounts(cid).map(acc => {
    const r = { acc, grp: groupOf(acc.type), missing: [], received: [], ready: [], problems: [], gaps: [], stale: [] };
    let prev = null;
    for (let m = 0; m < 12; m++) {
      if (!isActiveMonth(acc, year, m)) continue;
      const p = getP(map, acc.id, m);
      if (p.skipped) continue;
      if (prev && !prev.p.reconciled && p.reconciled) r.problems.push(`${MONTHS[m]} is marked reconciled but ${MONTHS[prev.m]} is not`);
      prev = { m, p };
      const b = balanceInfo(acc, map, m);
      if (b.chainBreak) r.problems.push(`${MONTHS[m]}: beginning balance ${fmtMoney(p.begin_bal)} doesn't match the prior ending ${fmtMoney(b.carried)}`);
      if (b.diff) r.problems.push(`${MONTHS[m]}: statement ${fmtMoney(p.end_bal)} vs books ${fmtMoney(p.gl_bal)}, off by ${fmtMoney(b.diff)}`);
      if (p.reconciled) {
        if (!docsEntered(acc, p)) r.problems.push(`${MONTHS[m]} is marked reconciled but documents aren't entered`);
        else if (!docsComplete(acc, p)) r.problems.push(`${MONTHS[m]} is reconciled but a document still needs scanning`);
        continue;
      }
      if (m > through) continue;
      const closed = isoDate(closeDate(acc, year, m)) <= tISO;
      const docs = [['stmt', p.stmt_status]];
      if (acc.has_gl) docs.push(['gl', p.gl_status]);
      for (const [doc, st] of docs) {
        if (st === 'not_received') { if (closed) r.missing.push({ m, doc, overdue: doc === 'stmt' && isOverdue(acc, p, year, m) }); }
        else if (!isEntered(st)) r.received.push({ m, doc, status: st });
      }
      if (docsEntered(acc, p)) r.ready.push(m);
    }
    if (acc.has_checks) getSeries(acc.id).forEach(s => {
      const sum = seriesSummary(s, getChecks(s.id));
      if (sum.gaps.length) r.gaps.push({ series: s.label, nums: sum.gaps });
      if (sum.stale.length) r.stale.push({ series: s.label, nums: sum.stale.map(x => x.number) });
    });
    return r;
  });

  let payroll = null;
  const setup = getPayrollSetup(cid);
  if (setup && setup.enabled) {
    const endISO = [tISO, isoDate(new Date(year, through + 1, 0))].sort()[0];
    const pmap = payRunMap(cid, year);
    const dates = payDates(setup, year).filter(d => d <= endISO);
    payroll = { service: setup.service, reports: [], notEntered: [], notTied: [], forms: [], todo: [], problems: [] };
    dates.forEach(d => {
      const st = runStatus(pmap, d);
      if (st === 'not_received') payroll.reports.push({ d, overdue: runOverdue(pmap, d) });
      else if (st === 'received') payroll.notEntered.push(d);
      else if (st === 'entered') payroll.notTied.push(d);
    });
    getQuarters(cid, year).forEach((r, i) => {
      const qn = i + 1;
      if (!quarterEnded(year, qn) || (qn * 3 - 1) > through || !quarterApplies(setup, year, qn, r)) return;
      const od = quarterOverdue(year, qn, r);
      if (!r.f941) payroll.forms.push({ label: `Form 941 for Q${qn} ${year}`, overdue: od });
      if (!r.nys45) payroll.forms.push({ label: `Form NYS-45 for Q${qn} ${year}`, overdue: od });
      if (!r.tied) payroll.todo.push(`Q${qn} payroll not tied out to the 941 / NYS-45`);
      if (r.wages_941 != null && r.wages_books != null && r.wages_941 !== r.wages_books) payroll.problems.push(`Q${qn} wages: 941 ${fmtMoney(r.wages_941)} vs books ${fmtMoney(r.wages_books)}`);
    });
    if (year < TODAY_YEAR && w3Applies(setup, cid, year)) {
      const py = getPayYear(cid, year);
      if (!py.w3) payroll.forms.push({ label: `Form W-3 for ${year}`, overdue: w3Overdue(year, py) });
      else if (!py.w3_tied) payroll.todo.push(`W-3 not tied to the 941s yet`);
    }
  }
  return { client: c, year, through, accounts, payroll, yearEnd: yearEndPending(cid, year) };
}

function fillPlaceholders(text, data, cfg) {
  const prof = reportProfile();
  const contact = clientReportPrefs(data.client).contact;

    date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
    preparer: prof.preparer || '', firm: prof.firm || ''
  };
  return String(text || '').replace(/\{(\w+)\}/g, (m, k) => (k in vals ? vals[k] : m));
}

/** Render one client's page. */
function renderReportPage(data, cfg) {
  const aud = cfg.audience, y = data.year;
  const o = cfg.opts, sec = cfg.sections;
  const accName = a => `${a.name}${o.last4 && a.last4 ? ` (••${a.last4})` : ''}`;
  const docName = (doc, grp, plural) => doc === 'gl' ? 'general ledger' : (grp === 'bank' ? `bank statement${plural ? 's' : ''}` : `statement${plural ? 's' : ''}`);
  const flag = (on, extra = '') => (on && o.flagOverdue ? ` <span class="rp-flag">— PAST DUE${extra}</span>` : '');
  const heading = s => esc(cfg.headings[s.key] || (aud === 'internal' ? s.label : s.client));
  const lists = {};
  const add = (key, html) => (lists[key] = lists[key] || []).push(html);

  // Documents still needed
  data.accounts.forEach(r => {
    ['stmt', 'gl'].forEach(doc => {
      const items = r.missing.filter(x => x.doc === doc);
      if (!items.length) return;
      const ms = items.map(x => x.m), od = items.some(x => x.overdue);
      add('missing', aud === 'internal'
        ? `<b>${esc(accName(r.acc))}</b> — ${docName(doc, r.grp, ms.length > 1)}: ${esc(ms.map(m => MONTHS[m]).join(', '))}${flag(od)}`
        : `${esc(accName(r.acc))} — ${docName(doc, r.grp, ms.length > 1)} for ${esc(fmtMonthsLong(ms, y))}${flag(od)}`);
    });
  });
  if (o.yearEnd) data.yearEnd.forEach(x => add('missing', `${esc(accName(x.acc))} — January ${y + 1} statement <span class="rp-note">(covers December ${closeDay(x.acc, y, 11) + 1}–31)</span>`));
  if (o.payroll && data.payroll) {
    const P = data.payroll;
    if (P.reports.length) add('missing', `Payroll reports${P.service ? ` (${esc(P.service)})` : ''} for the pay date${P.reports.length > 1 ? 's' : ''} ${esc(P.reports.map(x => fmtShort(parseISO(x.d))).join(', '))}${flag(P.reports.some(x => x.overdue))}`);
    P.forms.forEach(f => add('missing', `${esc(f.label)}${flag(f.overdue)}`));
  }
  // Received, waiting on entry
  data.accounts.forEach(r => {
    if (!r.received.length) return;
    add('received', `<b>${esc(accName(r.acc))}</b> — ${r.received.map(x => `${MONTHS[x.m]} ${x.doc === 'gl' ? 'GL' : 'statement'} (${esc(statusLabel(x.status).toLowerCase())})`).join('; ')}`);
  });
  if (o.payroll && data.payroll && data.payroll.notEntered.length) add('received', `Payroll — received, not entered: ${esc(data.payroll.notEntered.map(d => fmtShort(parseISO(d))).join(', '))}`);
  // Ready
  data.accounts.forEach(r => { if (r.ready.length) add('ready', `<b>${esc(accName(r.acc))}</b> — ${esc(r.ready.map(m => MONTHS[m]).join(', '))}`); });
  if (o.payroll && data.payroll) {
    if (data.payroll.notTied.length) add('ready', `Payroll — entered, not tied to bank: ${esc(data.payroll.notTied.map(d => fmtShort(parseISO(d))).join(', '))}`);
    data.payroll.todo.forEach(t => add('ready', esc(t)));
  }
  // Problems
  data.accounts.forEach(r => r.problems.forEach(t => add('problems', `<b>${esc(accName(r.acc))}</b> — ${esc(t)}`)));
  if (o.payroll && data.payroll) data.payroll.problems.forEach(t => add('problems', `Payroll — ${esc(t)}`));
  // Checks
  data.accounts.forEach(r => {
    r.gaps.forEach(g => add('checks', aud === 'internal'
      ? `<b>${esc(accName(r.acc))}</b> (${esc(g.series)}) — unaccounted: ${esc(compressNums(g.nums))}`
      : `${esc(accName(r.acc))}: we have no record of check${g.nums.length > 1 ? 's' : ''} ${esc(hashNums(g.nums))}. Were ${g.nums.length > 1 ? 'these' : 'this'} voided or written? If written, please send the details.`));
    r.stale.forEach(g => add('checks', aud === 'internal'
      ? `<b>${esc(accName(r.acc))}</b> (${esc(g.series)}) — outstanding ${staleMonths()}+ months: ${esc(compressNums(g.nums))}`
      : `${esc(accName(r.acc))}: check${g.nums.length > 1 ? 's' : ''} ${esc(hashNums(g.nums))} ${g.nums.length > 1 ? 'have' : 'has'} not cleared the bank in over ${staleMonths()} months. Should ${g.nums.length > 1 ? 'they' : 'it'} be voided?`));
  });

  const listCls = o.boxes ? 'rp-list boxes' : 'rp-list';
  let body = '';
  REPORT_SECTIONS.forEach(s => {
    if (!sec[s.key] || !lists[s.key]) return;
    body += `<section class="rp-sec"><h3>${heading(s)}</h3><ul class="${listCls}">${lists[s.key].map(x => `<li>${x}</li>`).join('')}</ul></section>`;
  });
  const empty = !body;
  if (empty) body = `<p class="rp-note">${aud === 'internal' ? 'Nothing outstanding — everything selected is up to date.' : 'We have everything we need at this time. Thank you!'}</p>`;

  const prof = reportProfile();
  const title = fillPlaceholders(cfg.title, data, cfg);
  const intro = fillPlaceholders(cfg.intro, data, cfg).trim();
  const closing = fillPlaceholders(cfg.closing, data, cfg).trim();
  const dateStr = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  let head = '';
  if (cfg.letter) {
    head = `<div class="rp-letterhead"><span><b>${esc(prof.firm || prof.preparer || '')}</b>${prof.contact ? `<br>${esc(prof.contact)}` : ''}</span><span>${esc(dateStr)}</span></div>
      <div class="rp-to">${esc(data.client.name)}</div>
      <div class="rp-title">${esc(title)}</div>`;
  } else {
    head = `<div class="rp-title">${esc(title)}</div>
      <div class="rp-meta">${esc(data.client.name)} · through ${esc(MONTHS_LONG[Math.max(0, data.through)])} ${y} · prepared ${esc(dateStr)}${prof.preparer ? ` by ${esc(prof.preparer)}` : ''}</div>`;
  }
  return { empty, html: `<div class="rp-page">${head}${intro ? `<div class="rp-text">${paras(intro)}</div>` : ''}${body}${closing ? `<div class="rp-text rp-closing">${paras(closing)}</div>` : ''}</div>` };
}

/* ---------- Report builder modal ---------- */
function reportModal(clientIds) {
  if (!clientIds.length) return toast('No clients to report on.');
  const single = clientIds.length === 1 ? one('SELECT * FROM clients WHERE id = ?', [clientIds[0]]) : null;
  const tplKey = (single && clientReportPrefs(single).template) || (single ? 'client' : 'internal');
  ui.modal = { kind: 'report', clientIds, through: Math.max(0, reportCutoff(ui.year)), skipEmpty: true, cfg: reportConfig(tplKey, single) };
  renderReportModal();
}
function renderReportModal() {
  const st = ui.modal, cfg = st.cfg;
  const single = st.clientIds.length === 1 ? one('SELECT * FROM clients WHERE id = ?', [st.clientIds[0]]) : null;
  const chk = (id, on, label, extra = '') => `<label class="check"><input type="checkbox" data-rp="${id}" ${on ? 'checked' : ''} ${extra}> ${label}</label>`;
  openModal({
    title: single ? `Report · ${single.name}` : `Report · ${st.clientIds.length} clients`,
    size: 'xwide',
    body: `<div class="rp-wrap">
      <div class="rp-controls">
        <div class="field"><label>Format</label><select class="input" data-rp="tpl">${Object.entries(REPORT_TEMPLATES).map(([k, t]) => `<option value="${k}" ${k === cfg.key ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}</select></div>
        <div class="field"><label>Through</label><select class="input" data-rp="through">${MONTHS_LONG.map((m, i) => `<option value="${i}" ${i === st.through ? 'selected' : ''}>${m} ${ui.year}</option>`).join('')}</select></div>
        <div class="section-title" style="margin-top:6px">Sections</div>
        ${REPORT_SECTIONS.map(s => chk(`sec:${s.key}`, cfg.sections[s.key], esc(cfg.audience === 'internal' ? s.label : s.client))).join('')}
        <div class="section-title">Options</div>
        ${REPORT_OPTS.map(([k, l]) => chk(`opt:${k}`, cfg.opts[k], l)).join('')}
        ${single ? '' : chk('skipEmpty', st.skipEmpty, 'Skip clients with nothing outstanding')}
        <div class="section-title">Wording</div>
        <div class="field"><label>Title</label><input class="input" data-rp="title" value="${esc(cfg.title)}"></div>
        <div class="field"><label>Opening</label><textarea class="input" data-rp="intro" rows="5">${esc(cfg.intro)}</textarea></div>
        <div class="field"><label>Closing</label><textarea class="input" data-rp="closing" rows="4">${esc(cfg.closing)}</textarea></div>
        <details><summary class="muted" style="cursor:pointer;font-size:12px;margin-bottom:8px">Section headings</summary>
          ${REPORT_SECTIONS.map(s => `<div class="field"><input class="input" data-rp="h:${s.key}" value="${esc(cfg.headings[s.key] || '')}" placeholder="${esc(cfg.audience === 'internal' ? s.label : s.client)}"></div>`).join('')}
        </details>
        <div class="hint">Placeholders: {client} {contact} {month} {year} {date} {preparer} {firm}. Your name and firm are set in File → Settings; the contact name in ✏️ Edit client.</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:12px">
          <button class="btn sm" data-action="rp-save-default">Save as default for “${esc(REPORT_TEMPLATES[cfg.key].label.split(' (')[0])}”</button>
          ${single ? `<button class="btn sm" data-action="rp-save-client">Save wording &amp; format for ${esc(single.name)}</button>` : ''}
          <button class="btn sm ghost" data-action="rp-reset">Reset to built-in wording</button>
        </div>
      </div>
      <div class="rp-paper" id="rpPaper"></div>
    </div>`,
    footer: `<button class="btn" data-action="modal-close">Close</button><button class="btn" data-action="rp-copy">📋 Copy text</button><button class="btn primary" data-action="print">🖨️ Print</button>`,
    onMount: root => {
      root.querySelectorAll('[data-rp]').forEach(el => el.addEventListener(el.tagName === 'SELECT' || el.type === 'checkbox' ? 'change' : 'input', () => {
        const k = el.dataset.rp;
        if (k === 'tpl') { st.cfg = reportConfig(el.value, single); return renderReportModal(); }
        if (k === 'through') st.through = +el.value;
        else if (k === 'skipEmpty') st.skipEmpty = el.checked;
        else if (k.startsWith('sec:')) cfg.sections[k.slice(4)] = el.checked ? 1 : 0;
        else if (k.startsWith('opt:')) cfg.opts[k.slice(4)] = el.checked ? 1 : 0;
        else if (k.startsWith('h:')) cfg.headings[k.slice(2)] = el.value;
        else cfg[k] = el.value;
        renderReportPaper();
      }));
      renderReportPaper();
    }
  });
}
function renderReportPaper() {
  const st = ui.modal;
  const pages = st.clientIds.map(id => renderReportPage(collectReport(id, ui.year, st.through), st.cfg));
  const shown = st.clientIds.length > 1 && st.skipEmpty ? pages.filter(p => !p.empty) : pages;
  $('rpPaper').innerHTML = shown.length ? shown.map(p => p.html).join('') : '<div class="rp-page"><p class="rp-note">Nothing outstanding for any client.</p></div>';
}
function saveReportDefault(forClient) {
  const st = ui.modal, cfg = st.cfg;
  const texts = { title: cfg.title, intro: cfg.intro, closing: cfg.closing, headings: cfg.headings };
  if (forClient) {
    const c = one('SELECT * FROM clients WHERE id = ?', [st.clientIds[0]]);
    const cp = clientReportPrefs(c);
    cp.template = cfg.key;
    cp.texts = { ...(cp.texts || {}), [cfg.key]: { ...texts, sections: cfg.sections, opts: cfg.opts } };
    mutate(`Report settings for ${c.name}`, () => setSetting(`client_report:${c.uuid}`, JSON.stringify(cp)));
    toast(`Saved — ${c.name}'s reports will open with this format and wording.`);
  } else {
    mutate(`Default ${REPORT_TEMPLATES[cfg.key].label}`, () => setSetting(`report_tpl:${cfg.key}`, JSON.stringify({ ...texts, sections: cfg.sections, opts: cfg.opts })));
    toast('Saved as the default for this format.');
  }
}
async function copyReportText() {
  const paper = $('rpPaper');
  const text = [...paper.querySelectorAll('.rp-page')].map(p => p.innerText.trim()).join('\n\n----------------------------------------\n\n');
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } finally { ta.remove(); }
  }
  toast('Report text copied — paste it into an email.');
}

/* =====================================================================
   BETA: Report editor v2

   Stored in settings: r2_templates (all templates) and r2_client:<uuid> (overrides).

const betaOn = () => getSetting('beta', '0') === '1';

const R2_KINDS = {

  paytie:     { label: 'Payroll entered, not tied out',   vars: ['payDates', 'count', 's'] },

  received: { label: 'Received, being processed', kinds: ['received', 'payrecv'] },
  ready:    { label: 'Ready to reconcile / tie out', kinds: ['ready', 'paytie', 'paytodo'] },
  problems: { label: 'Problems to fix', kinds: ['problems'] },
  checks:   { label: 'Questions about checks', kinds: ['gaps', 'stale'] }
};
const R2_TEXT_NAMES = {
  title: 'Title', intro: 'Opening', closing: 'Closing', 'hdr.left': 'Letterhead main block', 'hdr.right': 'Letterhead side block',
  'hdr.recipient': 'Recipient block', 'hdr.re': 'Re: line', 'snip.pastDue': 'Snippet {pastDue}', 'snip.last4': 'Snippet {last4}'
};
const r2FieldName = k => R2_TEXT_NAMES[k]
  || (k.startsWith('head:') ? `“${R2_SECTIONS[k.slice(5)]?.label}” heading`
  : k.startsWith('lead:') ? `“${R2_SECTIONS[k.slice(5)]?.label}” sentence`
  : k.startsWith('item:') ? `Line: ${R2_KINDS[k.split(':')[2]]?.label}` : k);
const R2_DATE_FMTS = {
  long: d => d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
  short: d => d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }),
  numeric: d => `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}/${d.getFullYear()}`,
  iso: d => isoDate(d)
};

/** Built-in defaults for the three starting templates. */
function r2Builtin(base) {
  const internal = base === 'internal', partner = base === 'partner';
  const v = {
    'opt:layout': 'section', 'opt:lhOn': internal || partner ? 0 : 1, 'opt:recOn': internal || partner ? 0 : 1, 'opt:reOn': 0,
    'opt:align': 'split', 'opt:dateFmt': 'long',
    'hdr.left': '{firm}\n{firmAddress}\n{firmPhone} · {firmEmail}', 'hdr.right': '{date}',
    'hdr.recipient': '{contact}\n{client}\n{contactAddress}', 'hdr.re': 'Re: Bookkeeping documents for {month} {year}',
    'snip.pastDue': internal ? ' — PAST DUE' : partner ? ' — past due' : ' (past due)', 'snip.last4': ' (••{digits})',
    order: ['docs', 'received', 'ready', 'problems', 'checks']
  };
  if (internal) Object.assign(v, { title: 'Reconciliation status — {client}', intro: '{client} · through {month} {year} · prepared {date}', closing: '' });
  else if (partner) Object.assign(v, { title: 'Items to request from {client}', intro: 'Please reach out to {client}{contactParen} for the items below. Check each one off as it comes in.', closing: '' });
  else Object.assign(v, {
    title: 'Documents needed to complete your books',
    intro: '{salutation}\n\nTo finish your bookkeeping through {throughDate}, we still need the items listed below. You can email them or drop them off, whichever is easier.',
    closing: 'Thank you for your help. Please reach out if you have any questions.\n\n{signature}'
  });
  const heads = internal
    ? { docs: 'Documents still needed', received: 'Received — waiting to be entered', ready: 'Ready to reconcile / tie out', problems: 'Problems to fix', checks: 'Check questions' }
    : { docs: 'Documents we still need', received: 'Received — being processed', ready: 'Ready for review', problems: 'Items that need attention', checks: 'Questions about checks' };
  for (const id of Object.keys(R2_SECTIONS)) {
    v[`sec:${id}:on`] = internal || id === 'docs' || id === 'checks' ? 1 : 0;
    v[`sec:${id}:showHead`] = 1;
    v[`sec:${id}:bullet`] = partner ? 'box' : 'dot';
    v[`head:${id}`] = heads[id];
    v[`lead:${id}`] = '';
    for (const k of R2_SECTIONS[id].kinds) v[`kind:${id}:${k}:on`] = 1;
  }
  const t = internal ? {
    missing: '{account}{last4} — {document}: {monthsShort}{pastDue}', yearend: '{account}{last4} — January {nextYear} statement (covers {period})',
    payreports: 'Payroll reports: {payDates}{pastDue}', forms: '{form} for {period}{pastDue}',
    received: '{account}{last4} — {monthsShort} {document} ({status})', payrecv: 'Payroll received, not entered: {payDates}',
    ready: '{account}{last4} — {monthsShort}', paytie: 'Payroll entered, not tied to bank: {payDates}', paytodo: '{task}',
    problems: '{account}{last4} — {problem}', gaps: '{account}{last4} ({series}) — unaccounted: {checkNumbers}',
    stale: '{account}{last4} ({series}) — outstanding {staleMonths}+ months: {checkNumbers}'
  } : {
    missing: '{account}{last4} — {document} for {months}{pastDue}', yearend: '{account}{last4} — January {nextYear} statement (covers {period})',
    payreports: 'Payroll reports for the pay date{s} {payDates}{pastDue}', forms: '{form} for {period}{pastDue}',
    received: '{account}{last4} — {document} for {months} (being processed)', payrecv: 'Payroll for {payDates} (being processed)',
    ready: '{account}{last4} — {months}', paytie: 'Payroll for {payDates}', paytodo: '{task}',
    problems: '{account}{last4}: {problem}',
    gaps: '{account}{last4}: we have no record of check{s} {checkNumbers}. Please let us know if {it} {wasWere} voided or written — if written, please send the details.',
    stale: '{account}{last4}: check{s} {checkNumbers} {hasHave} not cleared the bank in over {staleMonths} months. Should {it} be voided?'
  };
  for (const id of Object.keys(R2_SECTIONS)) for (const k of R2_SECTIONS[id].kinds) v[`item:${id}:${k}`] = t[k];
  return v;
}

/* ---------- storage ---------- */
function r2Store() { return jsonSetting('r2_templates', null); }
/** First use: create templates from the built-ins, carrying over the legacy report's saved wording. */
function r2EnsureStore() {
  if (r2Store()) return;
  const list = [['client', 'Letter to client'], ['partner', 'Missing-items list'], ['internal', 'Internal checklist']].map(([base, name]) => {
    const values = {};
    const old = jsonSetting(`report_tpl:${base}`, null);
    if (old) {
      ['title', 'intro', 'closing'].forEach(k => { if (old[k] != null) values[k] = old[k]; });
      const map = { missing: 'docs', received: 'received', ready: 'ready', problems: 'problems', checks: 'checks' };
      Object.entries(old.headings || {}).forEach(([k, h]) => { if (h && map[k]) values[`head:${map[k]}`] = h; });
      Object.entries(old.sections || {}).forEach(([k, on]) => { if (map[k]) values[`sec:${map[k]}:on`] = on ? 1 : 0; });
      if (old.opts) {
        if (old.opts.boxes) Object.values(map).forEach(id => { values[`sec:${id}:bullet`] = 'box'; });
        if (old.opts.last4 === 0) values['snip.last4'] = '';
        if (old.opts.flagOverdue === 0) values['snip.pastDue'] = '';
        if (old.opts.payroll === 0) ['payreports', 'forms'].forEach(k => { values[`kind:docs:${k}:on`] = 0; });
        if (old.opts.yearEnd === 0) values['kind:docs:yearend:on'] = 0;
      }
    }
    return { id: base, name, base, values };
  });
  const store = { default: 'client', list };
  mutate('Set up report templates', () => {
    setSetting('r2_templates', JSON.stringify(store));
    getClients(true).forEach(c => {             // carry over each client's saved legacy wording
      const cp = clientReportPrefs(c);
      const rec = { template: cp.template || '', overrides: {} };
      Object.entries(cp.texts || {}).forEach(([key, t]) => {
        const o = {};
        ['title', 'intro', 'closing'].forEach(k => { if (t[k] != null) o[k] = t[k]; });
        if (Object.keys(o).length) rec.overrides[key] = o;
      });
      if (rec.template || Object.keys(rec.overrides).length) setSetting(`r2_client:${c.uuid}`, JSON.stringify(rec));
    });
  });
}
const r2Tpl = id => (r2Store().list.find(t => t.id === id) || r2Store().list[0]);
const r2ClientRec = c => jsonSetting(`r2_client:${c.uuid}`, { template: '', overrides: {} });
const r2TemplateValues = tpl => ({ ...r2Builtin(tpl.base), ...tpl.values });
const r2ClientOverrides = (c, tplId) => (c ? (r2ClientRec(c).overrides || {})[tplId] || {} : {});
function r2Effective(tplId, c) { return { ...r2TemplateValues(r2Tpl(tplId)), ...r2ClientOverrides(c, tplId) }; }
function r2SaveStore(store, label) { mutate(label, () => setSetting('r2_templates', JSON.stringify(store))); }

/* ---------- letter variables ---------- */
function r2LetterVars(c, year, through, values, itemCount) {
  const prof = reportProfile(), cp = clientReportPrefs(c);
  const contact = cp.contact || '';
  const first = cp.contactFirst || contact.split(/\s+/)[0] || '';
  const fmt = R2_DATE_FMTS[values['opt:dateFmt']] || R2_DATE_FMTS.long;
  const now = new Date();
  const respond = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (parseInt(prof.respondDays, 10) || 10));
  const signature = prof.signature || ['Sincerely,', prof.preparer, prof.firm].filter(Boolean).join('\n');
  return {
    client: c.name, contact: contact || c.name, contactFirst: first || c.name, contactParen: contact ? ` (${contact})` : '',
    salutation: cp.salutation || `Dear ${first || contact || c.name},`,
    contactEmail: cp.contactEmail || '', contactPhone: cp.contactPhone || '', contactAddress: cp.contactAddress || '',
    date: fmt(now), month: MONTHS_LONG[Math.max(0, through)], year: String(year),
    throughDate: fmt(new Date(year, through + 1, 0)), respondBy: fmt(respond), itemCount: String(itemCount),
    preparer: prof.preparer || '', firm: prof.firm || '', firmPhone: prof.firmPhone || '', firmEmail: prof.firmEmail || '',
    firmAddress: prof.firmAddress || '', firmContact: prof.contact || '', signature
  };
}

  pastDue: 'Only on late items (snippet)', nextYear: 'Year after the report year', payDates: 'Pay dates', service: 'Payroll service',
  form: 'Form 941 / NYS-45 / W-3', quarter: 'Q1–Q4', status: 'Received / Needs entry…', task: 'What still needs tying out', problem: 'What’s wrong',
  series: 'Check series label', checkNumbers: '#1017, #1023', staleMonths: 'Stale threshold (Settings)', wasWere: '“was” or “were”'
};

/* ---------- items from the tracker's data ---------- */
function r2Items(cid, year, through) {
  const d = collectReport(cid, year, through);
  const out = [];
  const add = (kind, id, vars) => out.push({ kind, id: `${kind}|${id}`, vars, late: !!vars.late });
  const many = (n, word) => (n > 1 ? `${word}s` : word);
  const accVars = acc => ({ account: acc.name, bank: acc.institution || '', digits: acc.last4 || '', type: typeLabel(acc.type) });
  const docWord = (doc, grp, n) => (doc === 'gl' ? many(n, 'general ledger') : many(n, grp === 'bank' ? 'bank statement' : 'statement'));
  const spanPeriod = (acc, ms) => `${periodRange(acc, year, ms[0]).split(' – ')[0]} – ${periodRange(acc, year, ms[ms.length - 1]).split(' – ')[1]}`;
  d.accounts.forEach(r => {
    ['stmt', 'gl'].forEach(doc => {
      const items = r.missing.filter(x => x.doc === doc);
      if (items.length) {
        const ms = items.map(x => x.m);
        add('missing', `${r.acc.id}:${doc}`, { ...accVars(r.acc), document: docWord(doc, r.grp, ms.length), months: fmtMonthsLong(ms, year),
          monthsShort: ms.map(m => MONTHS[m]).join(', '), period: spanPeriod(r.acc, ms), count: ms.length, late: items.some(x => x.overdue) });
      }
      const rec = r.received.filter(x => x.doc === doc);
      if (rec.length) {
        const ms = rec.map(x => x.m);
        add('received', `${r.acc.id}:${doc}`, { ...accVars(r.acc), document: docWord(doc, r.grp, ms.length), months: fmtMonthsLong(ms, year),
          monthsShort: ms.map(m => MONTHS[m]).join(', '), status: [...new Set(rec.map(x => statusLabel(x.status).toLowerCase().replace(/\s*\(([^)]*)\)/g, ', $1')))].join('; '), count: ms.length });
      }
    });
    if (r.ready.length) add('ready', r.acc.id, { ...accVars(r.acc), months: fmtMonthsLong(r.ready, year), monthsShort: r.ready.map(m => MONTHS[m]).join(', '), count: r.ready.length });
    r.problems.forEach((p, i) => add('problems', `${r.acc.id}:${i}`, { ...accVars(r.acc), problem: p }));
    r.gaps.forEach(g => add('gaps', `${r.acc.id}:${g.series}`, { ...accVars(r.acc), series: g.series, checkNumbers: hashNums(g.nums), count: g.nums.length }));
    r.stale.forEach(g => add('stale', `${r.acc.id}:${g.series}`, { ...accVars(r.acc), series: g.series, checkNumbers: hashNums(g.nums), count: g.nums.length, staleMonths: staleMonths() }));
  });
  d.yearEnd.forEach(x => add('yearend', x.acc.id, { ...accVars(x.acc), nextYear: year + 1, period: `December ${closeDay(x.acc, year, 11) + 1}–31, ${year}` }));
  if (d.payroll) {
    const P = d.payroll, dates = list => list.map(x => fmtShort(parseISO(x.d || x))).join(', ');
    if (P.reports.length) add('payreports', 'reports', { payDates: dates(P.reports), count: P.reports.length, service: P.service || '', late: P.reports.some(x => x.overdue) });
    P.forms.forEach(f => {
      const m = /^(Form [\w-]+) for (Q\d) (\d{4})$/.exec(f.label) || /^(Form [\w-]+) for (\d{4})$/.exec(f.label);
      add('forms', f.label, m && m[3] ? { form: m[1], quarter: m[2], year: m[3], period: `${m[2]} ${m[3]}`, late: f.overdue }
        : { form: m ? m[1] : f.label, quarter: '', year: m ? m[2] : String(year), period: m ? m[2] : String(year), late: f.overdue });
    });
    if (P.notEntered.length) add('payrecv', 'recv', { payDates: dates(P.notEntered), count: P.notEntered.length });
    if (P.notTied.length) add('paytie', 'tie', { payDates: dates(P.notTied), count: P.notTied.length });
    P.todo.forEach((t, i) => add('paytodo', i, { task: t }));
    P.problems.forEach((p, i) => add('problems', `payroll:${i}`, { account: 'Payroll', digits: '', problem: p }));
  }
  out.forEach(it => {
    const n = it.vars.count || 1;
    Object.assign(it.vars, { s: n > 1 ? 's' : '', it: n > 1 ? 'they' : 'it', hasHave: n > 1 ? 'have' : 'has', wasWere: n > 1 ? 'were' : 'was' });
    it.group = it.vars.account || (['payreports', 'forms', 'payrecv', 'paytie', 'paytodo'].includes(it.kind) ? 'Payroll' : 'Other');
  });
  return out;
}

/* ---------- filling text ---------- */
/** mode 'html' (preview/print) or 'text' (email). Unknown {names} are highlighted in html and counted. */
function r2Fill(text, vars, values, mode = 'html', bad = { n: 0 }) {
  const enc = mode === 'html' ? esc : x => String(x);
  return enc(String(text ?? '')).replace(/\{(\w+)\}/g, (m, k) => {
    if (k === 'pastDue') return vars.late ? r2Fill(values['snip.pastDue'], vars, values, mode, bad) : '';
    if (k === 'last4') return vars.digits ? r2Fill(values['snip.last4'], vars, values, mode, bad) : '';
    if (k in vars) { const v = String(vars[k] ?? ''); return mode === 'html' ? esc(v).replace(/\n/g, '<br>') : v; }
    bad.n++;
    return mode === 'html' ? `<mark class="r2-bad" title="Unknown variable">${m}</mark>` : m;
  });
}

/** Sections in order, with the items that will actually print. */
function r2Plan(values, items, excluded) {
  return (values.order || Object.keys(R2_SECTIONS)).filter(id => R2_SECTIONS[id] && +values[`sec:${id}:on`]).map(id => ({
    id, items: items.filter(it => R2_SECTIONS[id].kinds.includes(it.kind) && +values[`kind:${id}:${it.kind}:on`] && !excluded[it.id])
      .sort((a, b) => R2_SECTIONS[id].kinds.indexOf(a.kind) - R2_SECTIONS[id].kinds.indexOf(b.kind))
  }));
}

function r2PageHTML(page, values, { editable = true } = {}) {
  const { vars, plan, client } = page;
  const F = (t, extra = {}) => r2Fill(t, { ...vars, ...extra }, values);
  const J = k => (editable ? ` data-r2jump="${k}"` : '');
  const block = k => {
    let lines = F(values[k]).split('\n');
    // Recipient: no contact name means {contact} falls back to the client name, so drop the repeat and any empty lines
    const plain = t => t.replace(/<[^>]*>/g, '').trim();
    if (k === 'hdr.recipient') lines = lines.filter((l, i) => plain(l) && (i === 0 || plain(l) !== plain(lines[i - 1])));
    if (k === 'hdr.left' && lines.length) lines[0] = `<b>${lines[0]}</b>`;
    return `<div class="r2-click"${J(k)}>${lines.join('<br>')}</div>`;
  };
  const paras = k => String(values[k] || '').split(/\n{2,}/).filter(p => p.trim()).map(p => `<p class="r2-click"${J(k)}>${F(p).replace(/\n/g, '<br>')}</p>`).join('');
  let h = '';
  if (+values['opt:lhOn']) {
    const logo = getSetting('report_logo', '') ? `<img src="${getSetting('report_logo', '')}" alt="" class="r2-logo">` : '';
    h += values['opt:align'] === 'split'
      ? `<div class="r2-lh r2-lh-split">${logo}${block('hdr.left')}<span style="flex:1"></span><div class="r2-rb">${block('hdr.right')}</div></div>`
      : `<div class="r2-lh r2-lh-${values['opt:align']}">${logo}<div>${block('hdr.left')}<div class="r2-sub">${block('hdr.right')}</div></div></div>`;
  }
  if (+values['opt:recOn']) h += `<div class="r2-rec">${block('hdr.recipient')}</div>`;
  if (+values['opt:reOn']) h += `<p class="r2-click r2-re"${J('hdr.re')}><b>${F(values['hdr.re'])}</b></p>`;
  if (String(values.title || '').trim()) h += `<h1 class="r2-click r2-title"${J('title')}>${F(values.title)}</h1>`;
  h += paras('intro');
  const li = (sec, it) => `<li class="r2-click"${J(`item:${sec}:${it.kind}`)}>${F(values[`item:${sec}:${it.kind}`], it.vars)}${editable ? `<button class="r2-x" data-r2x="${esc(page.cid)}|${esc(it.id)}" title="Leave this out of this letter (e.g. it just came in)">✕</button>` : ''}</li>`;
  const list = (bullet, lis) => (lis.length ? `<${bullet === 'num' ? 'ol' : 'ul'} class="r2-list r2-b-${bullet}">${lis.join('')}</${bullet === 'num' ? 'ol' : 'ul'}>` : '');
  const nonEmpty = plan.filter(s => s.items.length);
  if (values['opt:layout'] === 'section') {
    nonEmpty.forEach(s => {
      const head = +values[`sec:${s.id}:showHead`] && String(values[`head:${s.id}`] || '').trim();
      h += `<section class="r2-sec">${head ? `<h3 class="r2-click"${J(`head:${s.id}`)}>${F(values[`head:${s.id}`])}</h3>` : ''}${String(values[`lead:${s.id}`] || '').trim() ? `<p class="r2-click r2-lead"${J(`lead:${s.id}`)}>${F(values[`lead:${s.id}`])}</p>` : ''}${list(values[`sec:${s.id}:bullet`], s.items.map(it => li(s.id, it)))}</section>`;
    });
  } else {
    const groups = new Map();
    nonEmpty.forEach(s => s.items.forEach(it => {
      const g = values['opt:layout'] === 'account' ? it.group : '_';
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(li(s.id, it));
    }));
    const bullet = nonEmpty.length ? values[`sec:${nonEmpty[0].id}:bullet`] : 'dot';
    for (const [g, lis] of groups) h += `<section class="r2-sec">${g !== '_' ? `<h4>${esc(g)}</h4>` : ''}${list(bullet, lis)}</section>`;
  }
  if (!nonEmpty.length) h += `<p class="r2-note">Nothing outstanding for ${esc(client.name)} in what this template includes.</p>`;
  h += `<div class="r2-closing">${paras('closing')}</div>`;
  return `<div class="r2-page">${h}</div>`;
}

function r2EmailText(page, values, { box = '☐ ', withHeader = false, subjectKey = 'title' } = {}) {
  const bad = { n: 0 };
  const T = (t, extra = {}) => r2Fill(t, { ...page.vars, ...extra }, values, 'text', bad);
  const out = [];
  const para = k => String(values[k] || '').split(/\n{2,}/).forEach(p => { if (p.trim()) out.push(T(p).trim(), ''); });
  if (withHeader) {
    if (+values['opt:lhOn']) out.push(T(values['hdr.left']), T(values['hdr.right']), '');
    if (+values['opt:recOn']) out.push(T(values['hdr.recipient']), '');
  }
  if (+values['opt:reOn'] && subjectKey !== 'hdr.re') out.push(T(values['hdr.re']), '');
  para('intro');
  const mark = (b, i) => (b === 'box' ? box : b === 'dot' ? '• ' : b === 'num' ? `${i + 1}. ` : '');
  const nonEmpty = page.plan.filter(s => s.items.length);
  if (values['opt:layout'] === 'section') {
    nonEmpty.forEach(s => {
      if (+values[`sec:${s.id}:showHead`] && String(values[`head:${s.id}`] || '').trim()) out.push(T(values[`head:${s.id}`]).toUpperCase());
      if (String(values[`lead:${s.id}`] || '').trim()) out.push(T(values[`lead:${s.id}`]));
      s.items.forEach((it, i) => out.push(mark(values[`sec:${s.id}:bullet`], i) + T(values[`item:${s.id}:${it.kind}`], it.vars)));
      out.push('');
    });
  } else {
    const groups = new Map();
    nonEmpty.forEach(s => s.items.forEach(it => { const g = values['opt:layout'] === 'account' ? it.group : '_'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(T(values[`item:${s.id}:${it.kind}`], it.vars)); }));
    const b = nonEmpty.length ? values[`sec:${nonEmpty[0].id}:bullet`] : 'dot';
    for (const [g, ls] of groups) { if (g !== '_') out.push(g); ls.forEach((l, i) => out.push(mark(b, i) + l)); out.push(''); }
  }
  para('closing');
  const subject = T(values[subjectKey]).replace(/^Re:\s*/i, '');
  return { subject, body: out.join('\n').replace(/\n{3,}/g, '\n\n').trim(), bad: bad.n };
}

/* ---------- the editor ---------- */
function report2Modal(clientIds) {
  if (!clientIds.length) return toast('No clients to report on.');
  r2EnsureStore();
  const single = clientIds.length === 1 ? one('SELECT * FROM clients WHERE id = ?', [clientIds[0]]) : null;
  const store = r2Store();
  const tplId = (single && r2ClientRec(single).template && store.list.some(t => t.id === r2ClientRec(single).template)) ? r2ClientRec(single).template : store.default;
  const through = ui.year === TODAY_YEAR ? Math.max(0, TODAY_MONTH - 1) : Math.max(0, reportCutoff(ui.year));   // last month that has fully ended
  ui.modal = { kind: 'report2', clientIds, single: single && single.id, tplId, through, edited: new Set(), excluded: {}, skipEmpty: true };
  r2LoadValues();
  r2Render();
}
function r2LoadValues() {
  const st = ui.modal;
  const c = st.single ? one('SELECT * FROM clients WHERE id = ?', [st.single]) : null;
  st.values = r2Effective(st.tplId, c);
  st.edited.clear();
}
const r2Client = () => (ui.modal.single ? one('SELECT * FROM clients WHERE id = ?', [ui.modal.single]) : null);
function r2Pages() {
  const st = ui.modal;
  return st.clientIds.map(cid => {
    const c = one('SELECT * FROM clients WHERE id = ?', [cid]);
    // In an all-clients report each page also applies that client's own customizations of this template
    const values = st.single ? st.values : { ...st.values, ...r2ClientOverrides(c, st.tplId) };
    const items = r2Items(cid, ui.year, st.through);
    const excluded = Object.fromEntries(Object.keys(st.excluded).filter(k => k.startsWith(cid + '|')).map(k => [k.slice(String(cid).length + 1), 1]));
    const plan = r2Plan(values, items, excluded);
    const count = plan.reduce((n, s) => n + s.items.length, 0);
    return { cid, client: c, values, plan, count, vars: r2LetterVars(c, ui.year, st.through, values, count) };
  });
}

      <button class="btn" data-action="modal-close">Close</button><button class="btn" data-action="r2-email">📋 Copy for email</button><button class="btn primary" data-action="print">🖨️ Print</button>`,

function r2Paper() {

}
function r2Tags() {

}
function r2VarsList(filter = '', target = 'r2Vars') {
  const st = ui.modal, pages = r2Pages(), page = pages[0];
  const items = page ? r2Items(page.cid, ui.year, st.through) : [];
  const sample = k => { const it = items.find(i => k in i.vars); return it ? String(it.vars[k]) : ''; };
  const groups = [['Letter', Object.keys(page ? page.vars : {})], ['Items', [...new Set(Object.values(R2_KINDS).flatMap(x => x.vars)), 'digits']]];
  const f = filter.toLowerCase();
  let h = '';
  groups.forEach(([g, keys]) => {
    const ks = keys.filter(k => !f || k.toLowerCase().includes(f) || (R2_VAR_HELP[k] || '').toLowerCase().includes(f));
    if (!ks.length) return;
    h += `<div class="r2-vg">${g}</div>` + ks.map(k => {
      const val = g === 'Letter' ? page.vars[k] : sample(k);
      return `<div class="r2-var" data-r2var="${k}"><code>{${k}}</code><span class="r2-val">${esc(String(val ?? '').split('\n')[0]) || '<span class="muted">—</span>'}</span><span class="r2-help">${esc(R2_VAR_HELP[k] || '')}</span></div>`;
    }).join('');
  });
  $(target).innerHTML = h || '<div class="muted" style="padding:6px">No match</div>';
}

function r2SetValue(k, val) {
  const st = ui.modal;
  st.values[k] = val;
  const c = r2Client();
  const saved = r2Effective(st.tplId, c)[k];
  if (JSON.stringify(saved) === JSON.stringify(val)) st.edited.delete(k); else st.edited.add(k);
}
function r2Mount(modalRoot) {
  // Listen on the dialog element (replaced on every render), not on #modalRoot, so handlers never pile up
  const root = modalRoot.querySelector('.modal-overlay');
  const st = ui.modal;
  let lastField = null, popTarget = null;
  const pop = root.querySelector('#r2Pop');
  const partial = el => { const m = /\{(\w*)$/.exec(el.value.slice(0, el.selectionStart ?? el.value.length)); return m ? { start: (el.selectionStart ?? el.value.length) - m[0].length, text: m[1] } : null; };
  const openPop = (el, anchor, search, filter = '') => {
    popTarget = el;
    const r = anchor.getBoundingClientRect();
    pop.style.left = Math.min(r.left, innerWidth - 360) + 'px';
    pop.style.top = Math.min(r.bottom + 6, innerHeight - 380) + 'px';
    root.querySelector('#r2PopSearch').value = filter;
    root.querySelector('#r2PopSearch').classList.toggle('hidden', !search);
    r2VarsList(filter, 'r2PopList');
    pop.classList.add('open');
    if (search) root.querySelector('#r2PopSearch').focus();
  };
  const insert = (el, name) => {
    if (!el) return;
    const p = partial(el), s = el.selectionStart ?? el.value.length, e = el.selectionEnd ?? s;
    const before = p ? el.value.slice(0, p.start) : el.value.slice(0, s);
    el.value = before + `{${name}}` + el.value.slice(e);
    el.focus();
    const pos = before.length + name.length + 2;
    el.setSelectionRange(pos, pos);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    pop.classList.remove('open');
  };
  root.addEventListener('focusin', e => { if (e.target.matches('.r2t')) lastField = e.target; });
  root.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'r2PopSearch') return r2VarsList(el.value, 'r2PopList');
    if (!el.matches('.r2t')) return;
    r2SetValue(el.dataset.r2, el.value);
    r2Paper(); r2Tags();
    const p = partial(el);
    if (p) openPop(el, el, false, p.text); else pop.classList.remove('open');
  });
  root.addEventListener('keydown', e => {
    if (e.key === 'Escape' && pop.classList.contains('open')) { e.stopPropagation(); pop.classList.remove('open'); return; }
    if ((e.key === 'Enter' || e.key === 'Tab') && pop.classList.contains('open') && e.target === popTarget) {
      const first = root.querySelector('#r2PopList [data-r2var]');
      if (first) { e.preventDefault(); e.stopPropagation(); insert(popTarget, first.dataset.r2var); }
    }
  }, true);
  root.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'r2Tpl') {
      if (el.value === '__manage') { el.value = st.tplId; if (st.edited.size && !confirm('Leave the report and drop your unsaved changes?')) return; return r2ManageModal(); }
      if (st.edited.size && !confirm('Switch templates and drop your unsaved changes?')) { el.value = st.tplId; return; }
      st.tplId = el.value; r2LoadValues(); return r2Render();
    }
    if (el.id === 'r2Through') { st.through = +el.value; r2Paper(); return r2VarsList(); }
    if (el.id === 'r2SkipEmpty') { st.skipEmpty = el.checked; return r2Paper(); }
    if (el.id === 'r2Logo') {
      const f = el.files[0]; if (!f) return;
      if (f.size > 400 * 1024) return toast('Please use a logo under 400 KB.');
      const r = new FileReader();
      r.onload = () => { mutate('Set letterhead logo', () => setSetting('report_logo', r.result)); };
      r.readAsDataURL(f); return;
    }
    if (!el.dataset.r2 || el.matches('.r2t')) return;
    const k = el.dataset.r2;
    r2SetValue(k, el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.value);
    const card = el.closest('.r2-card'); if (card && k.endsWith(':on') && k.startsWith('sec:')) card.classList.toggle('off', !el.checked);
    const kind = el.closest('.r2-kind'); if (kind && k.startsWith('kind:')) kind.classList.toggle('off', !el.checked);
    r2Paper(); r2Tags(); r2VarsList();
  });
  root.addEventListener('click', e => {
    const t = e.target;
    const v = t.closest('[data-r2var]');
    if (v) { insert(v.closest('#r2Pop') ? popTarget : lastField, v.dataset.r2var); return; }
    const ins = t.closest('[data-r2ins]');
    if (ins) { e.preventDefault(); const el = root.querySelector(`[data-r2="${CSS.escape(ins.dataset.r2ins)}"]`); lastField = el; openPop(el, ins, true); return; }
    if (!t.closest('#r2Pop')) pop.classList.remove('open');
    const x = t.closest('[data-r2x]');
    if (x) { e.stopPropagation(); st.excluded[x.dataset.r2x] = 1; r2Paper(); toast('Left out of this letter only — it stays on the list in the tracker.'); return; }
    const rs = t.closest('[data-r2restore]');
    if (rs) { if (rs.dataset.r2restore === '*') st.excluded = {}; else delete st.excluded[rs.dataset.r2restore]; return r2Paper(); }
    const set = t.closest('[data-r2set]');
    if (set) { r2SetValue(set.dataset.r2set, set.dataset.v); set.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === set)); r2Paper(); r2Tags(); return; }
    const un = t.closest('[data-r2undo]');
    if (un) {
      const k = un.dataset.r2undo; st.values[k] = r2Effective(st.tplId, r2Client())[k]; st.edited.delete(k);
      const el = root.querySelector(`[data-r2="${CSS.escape(k)}"]`); if (el) el.value = st.values[k] ?? '';
      r2Paper(); r2Tags(); return;
    }
    const ut = t.closest('[data-r2usetpl]');
    if (ut) { e.preventDefault(); return r2UseTemplate(ut.dataset.r2usetpl); }
    const mv = t.closest('[data-r2move]');
    if (mv) { const [id, d] = mv.dataset.r2move.split(':'); return r2Move(id, +d); }
    const j = t.closest('[data-r2jump]');
    if (j) {
      const k = j.dataset.r2jump;
      const el = root.querySelector(`[data-r2="${CSS.escape(k)}"]`);
      if (el) {
        const d = el.closest('details'); if (d) d.open = true;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.remove('r2-flash'); void el.offsetWidth; el.classList.add('r2-flash');
        setTimeout(() => el.focus(), 250);
      }
    }
  });
  // drag to reorder sections
  let dragId = null;
  root.addEventListener('mousedown', e => { const h = e.target.closest('.r2-drag'); if (h) h.closest('.r2-card').draggable = true; });
  root.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.r2-card'); if (!c) return; dragId = c.dataset.r2card; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
  root.addEventListener('dragover', e => {
    const c = e.target.closest && e.target.closest('.r2-card'); if (!c || !dragId) return;
    e.preventDefault();
    root.querySelectorAll('.r2-card').forEach(x => x.classList.remove('drop-before', 'drop-after'));
    if (c.dataset.r2card !== dragId) { const r = c.getBoundingClientRect(); c.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after'); }
  });
  root.addEventListener('drop', e => {
    const c = e.target.closest && e.target.closest('.r2-card'); if (!c || !dragId) return;
    e.preventDefault();
    const order = [...st.values.order].filter(x => x !== dragId);
    let i = order.indexOf(c.dataset.r2card) + (c.classList.contains('drop-after') ? 1 : 0);
    order.splice(i, 0, dragId);
    dragId = null; r2SetValue('order', order); r2Render();
  });
  root.addEventListener('dragend', () => { dragId = null; root.querySelectorAll('.r2-card').forEach(x => { x.draggable = false; x.classList.remove('dragging', 'drop-before', 'drop-after'); }); });
}
function r2Move(id, d) {
  const st = ui.modal, order = [...st.values.order], i = order.indexOf(id), j = i + d;
  if (j < 0 || j >= order.length) return;
  order.splice(j, 0, order.splice(i, 1)[0]);
  r2SetValue('order', order); r2Render();
}
/** Persist edited keys. to = 'client' | 'template' */
function r2Save(to) {
  const st = ui.modal, c = r2Client(), keys = [...st.edited];
  if (!keys.length) return;
  const store = r2Store(), tpl = store.list.find(t => t.id === st.tplId);
  mutate(to === 'client' ? `Report wording for ${c.name}` : `Template “${tpl.name}”`, () => {
    if (to === 'template') {
      keys.forEach(k => { tpl.values[k] = st.values[k]; });
      setSetting('r2_templates', JSON.stringify(store));
      if (c) {   // what was just saved to the template now applies to this client too
        const rec = r2ClientRec(c), o = (rec.overrides = rec.overrides || {})[st.tplId] || {};
        keys.forEach(k => delete o[k]); rec.overrides[st.tplId] = o;
        setSetting(`r2_client:${c.uuid}`, JSON.stringify(rec));
      }
    } else {
      const rec = r2ClientRec(c), o = (rec.overrides = rec.overrides || {})[st.tplId] || {};
      const tv = r2TemplateValues(tpl);
      keys.forEach(k => { if (JSON.stringify(tv[k]) === JSON.stringify(st.values[k])) delete o[k]; else o[k] = st.values[k]; });
      rec.overrides[st.tplId] = o;
      setSetting(`r2_client:${c.uuid}`, JSON.stringify(rec));
    }
  });
  st.edited.clear();
  r2Tags();
  toast(to === 'client' ? `Saved for ${c.name} only.` : `Saved to “${tpl.name}” for every client using it.`, 'Undo', undo, 6000);
}
function r2UseTemplate(k) {
  const st = ui.modal, c = r2Client(); if (!c) return;
  const rec = r2ClientRec(c), o = (rec.overrides || {})[st.tplId] || {};
  delete o[k]; rec.overrides[st.tplId] = o;
  mutate(`${r2FieldName(k)} back to template for ${c.name}`, () => setSetting(`r2_client:${c.uuid}`, JSON.stringify(rec)));
  st.values[k] = r2Effective(st.tplId, c)[k]; st.edited.delete(k);
  r2Render();
  toast(`${r2FieldName(k)} now follows the template.`, 'Undo', undo, 6000);
}
function r2MakeDefault() {
  const st = ui.modal, c = r2Client(), store = r2Store();
  if (c) { const rec = r2ClientRec(c); rec.template = st.tplId; mutate(`${c.name} uses “${r2Tpl(st.tplId).name}”`, () => setSetting(`r2_client:${c.uuid}`, JSON.stringify(rec))); }
  else { store.default = st.tplId; r2SaveStore(store, 'Default report template'); }
  r2Render();
}
/** Called after undo / live sync while the editor is open: keep unsaved edits, refresh everything else. */
function r2Refresh() {
  const st = ui.modal, keep = {};
  st.edited.forEach(k => { keep[k] = st.values[k]; });
  if (!r2Store() || !r2Store().list.some(t => t.id === st.tplId)) { r2EnsureStore(); st.tplId = r2Store().default; }
  const ed = [...st.edited];
  r2LoadValues();
  ed.forEach(k => r2SetValue(k, keep[k]));
  r2Render();
}

/* ---------- managing templates ---------- */
function r2ManageModal(prevClientIds = ui.modal && ui.modal.clientIds) {

    size: 'wide',
    body: `<div class="hint" style="margin-top:0;margin-bottom:12px">A template holds the wording, sections, snippets and layout. Each client uses one template and can customize any field for itself in the report editor.</div>
      <div class="tpl-list">${store.list.map(t => {
        const diff = Object.keys(t.values).filter(k => JSON.stringify(t.values[k]) !== JSON.stringify(r2Builtin(t.base)[k]));

          ${diff.length ? `<button class="btn sm" data-r2restoreall="${esc(t.id)}">Restore built-in wording…</button>` : ''}
          ${store.list.length > 1 && t.id !== store.default ? `<button class="btn sm danger" data-r2del="${esc(t.id)}">Delete</button>` : ''}
          ${diff.length ? `<details style="flex-basis:100%;margin-top:6px"><summary class="muted" style="cursor:pointer;font-size:12px">Show what differs from built-in</summary>
            ${diff.map(k => `<div class="r2-diff"><div style="display:flex;gap:8px;align-items:center"><b>${esc(r2FieldName(k))}</b><span class="spacer"></span><button class="btn sm ghost" data-r2restore1="${esc(t.id)}|${esc(k)}">Restore built-in</button></div>
              <div class="r2-diff-cols"><div><span class="muted">Template</span><br>${esc(JSON.stringify(t.values[k]).replace(/^"|"$/g, '').replace(/\\n/g, '\n'))}</div><div><span class="muted">Built-in</span><br>${esc(JSON.stringify(r2Builtin(t.base)[k] ?? '').replace(/^"|"$/g, '').replace(/\\n/g, '\n'))}</div></div></div>`).join('')}</details>` : ''}
        </div>`; }).join('')}</div>
      <div class="hint">Restoring built-in wording affects every client using the template, except fields a client customized. Everything here can be undone with Ctrl+Z.</div>`,
    footer: `${back ? '<button class="btn" data-action="r2-manage-back">‹ Back to report</button>' : ''}<span class="spacer"></span><button class="btn primary" data-action="modal-close">Done</button>`,
    onMount: modalRoot => {
      const root = modalRoot.querySelector('.modal-overlay');
      root.addEventListener('change', e => {
        const n = e.target.dataset.r2name; if (!n) return;
        const s = r2Store(), t = s.list.find(x => x.id === n), name = e.target.value.trim();
        if (name && name !== t.name) { t.name = name; r2SaveStore(s, `Rename template to “${name}”`); }
      });

const csvCell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const csvLine = arr => arr.map(csvCell).join(',');
const moneyCSV = c => (c == null ? '' : (c / 100).toFixed(2));
function parseCSV(text) {
  const rows = []; let row = [], field = '', inQ = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
    else field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

async function exportCSV(kind) {

function guessType(name) {
  const n = name.toLowerCase();
  if (/(credit card|visa|mastercard|amex|american express|discover|\bcard\b)/.test(n)) return 'credit_card';
  if (/(line of credit|\bloc\b|heloc)/.test(n)) return 'line_of_credit';
  if (/(loan|mortgage|note payable|sba|auto)/.test(n)) return 'loan';
  if (/(saving)/.test(n)) return 'savings';
  if (/(money market)/.test(n)) return 'money_market';
  return 'checking';
}
const normStatus = v => { v = String(v || '').trim().toLowerCase(); return STATUS_RANK[v] != null ? v : (STATUSES.find(s => s.label.toLowerCase() === v)?.v || 'not_received'); };
const truthy = v => /^(true|yes|y|1|x|✓)$/i.test(String(v || '').trim());
const moneyIn = v => { const c = parseMoney(v); return Number.isNaN(c) ? null : c; };

/* Match by UUID first, then by name */
function findOrCreateClient(u, name, notes = '', archived = 0) {
  let r = u ? one('SELECT id FROM clients WHERE uuid = ?', [u]) : null;
  if (!r && name) r = one('SELECT id FROM clients WHERE name = ? COLLATE NOCASE', [name]);
  if (r) return r.id;
  return insertClient({ name, notes, archived, uuid: u || null });
}
function findOrCreateAccount(clientId, u, name, fields = {}) {
  let r = u ? one('SELECT id FROM accounts WHERE uuid = ?', [u]) : null;
  if (!r && name) r = one('SELECT id FROM accounts WHERE client_id = ? AND name = ? COLLATE NOCASE', [clientId, name]);
  if (r) {
    const sets = [], vals = [];
    if (fields.has_gl != null) { sets.push('has_gl = ?'); vals.push(fields.has_gl); }
    if (fields.has_checks != null) { sets.push('has_checks = ?'); vals.push(fields.has_checks); }
    if (fields.closing_day !== undefined) { sets.push('closing_day = ?'); vals.push(fields.closing_day); }
    if (sets.length) run(`UPDATE accounts SET ${sets.join(', ')} WHERE id = ?`, [...vals, r.id]);
    return r.id;
  }
  const type = ACCOUNT_TYPES[fields.type] ? fields.type : guessType(name);
  return insertAccount({ uuid: u || null, client_id: clientId, name, type, institution: fields.institution, last4: fields.last4, opened: fields.opened || null, closed: fields.closed || null,
    has_gl: fields.has_gl ?? (groupOf(type) === 'bank' ? 1 : 0), has_checks: fields.has_checks, closing_day: fields.closing_day, arrival_days: fields.arrival_days ?? 7 });
}

function importCSVText(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return alert('That CSV looks empty.');
  const hdr = rows[0].map(h => h.trim().toLowerCase());
  const idx = n => hdr.indexOf(n);
  const g = (r, n) => (idx(n) >= 0 ? (r[idx(n)] || '').trim() : '');
  let count = 0;

  if (hdr.includes('layer') && hdr.includes('entity')) {                      // old tracker format
    const year = ui.year;
    if (!confirm(`This looks like a CSV from the old tracker (no year in the file).\n\nImport it into ${year}? Account types will be guessed from the names — fix them with ✏️ Edit afterwards.`)) return;
    const iJan = idx('jan');
    mutate(`Import legacy CSV into ${year}`, () => {
      rows.slice(1).forEach(r => {
        const entity = g(r, 'entity'), accName = g(r, 'account'), layer = g(r, 'layer').toLowerCase();
        if (!entity || !accName) return;
        const accId = findOrCreateAccount(findOrCreateClient(null, entity), null, accName, { has_gl: 1 });
        for (let m = 0; m < 12; m++) {
          const v = r[iJan + m];
          if (layer.includes('statement')) setPeriod(accId, year, m, { stmt_status: normStatus(v) });
          else if (layer.includes('ledger')) setPeriod(accId, year, m, { gl_status: normStatus(v) });
          else if (layer.includes('reconcil')) setPeriod(accId, year, m, { reconciled: truthy(v) ? 1 : 0 });
        }
        count++;
      });
    });
  } else if (hdr.includes('check number')) {                                 // check registers
    if (!confirm(`Merge ${rows.length - 1} check rows into this database?`)) return;
    mutate('Import check registers', () => {
      rows.slice(1).forEach(r => {
        const cid = findOrCreateClient(g(r, 'client uuid'), g(r, 'client'));
        const accId = findOrCreateAccount(cid, g(r, 'account uuid'), g(r, 'account'), { has_checks: 1 });
        const su = g(r, 'series uuid'), label = g(r, 'series') || 'Checks';
        let s = su ? one('SELECT id FROM check_series WHERE uuid = ?', [su]) : null;
        if (!s) s = one('SELECT id FROM check_series WHERE account_id = ? AND label = ? COLLATE NOCASE', [accId, label]);
        const sid = s ? s.id : insertSeries({ uuid: su || null, account_id: accId, label, start_no: parseInt(g(r, 'series start'), 10) || 1, end_no: parseInt(g(r, 'series end'), 10) || null });
        const n = parseInt(g(r, 'check number'), 10), state = g(r, 'state').toLowerCase();
        if (!Number.isFinite(n) || !CHECK_STATES[state]) return;
        applyCheckPlan(sid, [{ n, next: { state, entered_ym: g(r, 'entered month') || null, cleared_ym: g(r, 'cleared month') || null } }]);
        count++;
      });
    });
  } else if (hdr.includes('record') && hdr.includes('period')) {             // payroll
    if (!confirm(`Merge ${rows.length - 1} payroll rows into this database?`)) return;
    mutate('Import payroll', () => {
      rows.slice(1).forEach(r => {
        const cid = findOrCreateClient(g(r, 'client uuid'), g(r, 'client'));
        const rec = g(r, 'record').toLowerCase(), y = parseInt(g(r, 'year'), 10);
        if (rec === 'setup') {
          const wd = WEEKDAYS.findIndex(d => d.toLowerCase() === g(r, 'pay weekday').toLowerCase());
          const ex = getPayrollSetup(cid);
          run(`INSERT INTO payroll_setup (client_id, uuid, enabled, service, pay_weekday, notes) VALUES (?,?,?,?,?,?)
               ON CONFLICT(client_id) DO UPDATE SET enabled = excluded.enabled, service = excluded.service, pay_weekday = excluded.pay_weekday, notes = excluded.notes`,
            [cid, (ex && ex.uuid) || uuid(), g(r, 'status') === 'disabled' ? 0 : 1, g(r, 'service'), wd >= 0 ? wd : 5, g(r, 'note')]);
        } else if (rec === 'week') {
          const st = g(r, 'status');
          if (PAY_RANK[st] == null || !/^\d{4}-\d{2}-\d{2}$/.test(g(r, 'period'))) return;
          setRun(cid, g(r, 'period'), st);
        } else if (rec === 'quarter') {
          const qn = parseInt(g(r, 'period').replace(/\D/g, ''), 10);
          if (!(qn >= 1 && qn <= 4) || !y) return;
          setQuarter(cid, y, qn, { f941: truthy(g(r, '941 received')), nys45: truthy(g(r, 'nys-45 received')), tied: truthy(g(r, 'tied')),
            wages_941: moneyIn(g(r, '941 wages')), wages_books: moneyIn(g(r, 'books wages')), note: g(r, 'note'), skipped: truthy(g(r, 'not required')) ? 1 : 0 });
        } else if (rec === 'year' && y) setPayYear(cid, y, { w3: truthy(g(r, 'w-3 received')), w3_tied: truthy(g(r, 'w-3 tied')), note: g(r, 'note') });
        else return;
        count++;
      });
    });
  } else {                                                                   // accounts & months
    if (['client', 'account', 'year', 'month'].some(n => idx(n) < 0)) return alert('Unrecognized CSV. Expected the columns from one of this tracker\'s exports.');
    if (!confirm(`Merge ${rows.length - 1} rows into this database? Clients and accounts are matched by ID, then by name; new ones are created.`)) return;
    mutate('Import CSV', () => {
      rows.slice(1).forEach(r => {
        const cname = g(r, 'client'); if (!cname && !g(r, 'client uuid')) return;
        const cid = findOrCreateClient(g(r, 'client uuid'), cname, g(r, 'client notes'), truthy(g(r, 'archived')) ? 1 : 0);
        if (idx('client start') >= 0) { run('UPDATE clients SET start_ym = ? WHERE id = ?', [/^\d{4}-\d{2}$/.test(g(r, 'client start')) ? g(r, 'client start') : null, cid]); resetCaches(); }
        const aname = g(r, 'account'); if (!aname && !g(r, 'account uuid')) return;
        const cd = g(r, 'closing day');
        const accId = findOrCreateAccount(cid, g(r, 'account uuid'), aname, {
          type: g(r, 'account type'), institution: g(r, 'institution'), last4: g(r, 'last4'), opened: g(r, 'opened'), closed: g(r, 'closed'),
          has_gl: idx('has gl') >= 0 ? (truthy(g(r, 'has gl')) ? 1 : 0) : null,
          has_checks: idx('tracks checks') >= 0 ? (truthy(g(r, 'tracks checks')) ? 1 : 0) : null,
          closing_day: idx('closing day') >= 0 ? (cd ? parseInt(cd, 10) : null) : undefined,
          arrival_days: g(r, 'arrival days') ? parseInt(g(r, 'arrival days'), 10) : 7
        });
        const y = parseInt(g(r, 'year'), 10);
        let m = MONTHS.findIndex(x => x.toLowerCase() === g(r, 'month').slice(0, 3).toLowerCase());
        if (m < 0) m = parseInt(g(r, 'month'), 10) - 1;
        if (!y || !(m >= 0 && m < 12)) return;
        const patch = { stmt_status: normStatus(g(r, 'statement status')), reconciled: truthy(g(r, 'reconciled')) ? 1 : 0, reconciled_on: g(r, 'reconciled on') || null };
        if (g(r, 'gl status')) patch.gl_status = normStatus(g(r, 'gl status'));
        if (idx('no activity') >= 0) patch.skipped = truthy(g(r, 'no activity')) ? 1 : 0;
        if (idx('ending balance') >= 0) Object.assign(patch, { begin_bal: moneyIn(g(r, 'beginning balance')), end_bal: moneyIn(g(r, 'ending balance')), gl_bal: moneyIn(g(r, 'gl balance')), note: g(r, 'note') });
        setPeriod(accId, y, m, patch);
        if (patch.reconciled && patch.reconciled_on) run('UPDATE periods SET reconciled_on = ? WHERE account_id = ? AND year = ? AND month = ?', [patch.reconciled_on, accId, y, m]);
        count++;
      });
    });
  }
  toast(`Imported ${count} row${count === 1 ? '' : 's'}.`);
}

        }
        (a.series || []).forEach(sr => {
          const sid = insertSeries({ account_id: accId, label: sr.label, start_no: sr.start });
          const plan = [];
          const span = sr.entered[1] - sr.entered[0] + 1;
          for (let n = sr.entered[0]; n <= sr.entered[1]; n++) {
            if (sr.skip && sr.skip.includes(n)) continue;
            const mIdx = Math.floor(((n - sr.entered[0]) / span) * (c + 1));
            if (sr.voids && sr.voids.includes(n)) plan.push({ n, next: { state: 'void', entered_ym: ym(mIdx), cleared_ym: null } });
            else if (n <= sr.cleared) plan.push({ n, next: { state: 'cleared', entered_ym: ym(mIdx), cleared_ym: ym(mIdx + 1) } });
            else plan.push({ n, next: { state: 'entered', entered_ym: ym(mIdx), cleared_ym: null } });
          }
          applyCheckPlan(sid, plan);
          if (sr.payroll) { paySeries = sid; payBank = accId; }
        });
      });
      if (s.payroll) {
        run('INSERT INTO payroll_setup (client_id, uuid, enabled, service, pay_weekday, bank_account_id, check_series_id) VALUES (?,?,?,?,?,?,?)',
          [cid, uuid(), 1, s.payroll.service, s.payroll.weekday, payBank, paySeries]);
        const today = todayISO();
        const dates = payDates(getPayrollSetup(cid), y).filter(d => d <= today);
        dates.forEach((d, i) => setRun(cid, d, i < dates.length - 3 ? 'tied' : i < dates.length - 1 ? 'received' : 'not_received'));
        for (let qn = 1; qn <= 4; qn++) if (quarterEnded(y, qn)) setQuarter(cid, y, qn, { f941: 1, nys45: qn < 3 ? 1 : 0, tied: qn < 3 ? 1 : 0, wages_941: 8650000 + qn * 12500, wages_books: 8650000 + qn * 12500 });
      }
    });
  });
}

/* =====================================================================
   Event wiring
   ===================================================================== */
function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); LS.set('rt.theme', t); }

async function handleAction(action, el, ev) {
  const accId = el.dataset.acc && el.dataset.acc !== 'payroll' ? +el.dataset.acc : null;
  switch (action) {
    case 'menu': $('fileMenu').classList.toggle('open'); return;
    case 'db-new': return actNewDb();
    case 'db-open': return actOpenDb();
    case 'db-reconnect': return actReconnect();
    case 'db-cache': return actUseCache();
    case 'db-copy': return db ? actDownloadCopy() : toast('No database open.');
    case 'csv-export': return db ? exportCSV(el.dataset.kind) : toast('Open a database first.');
    case 'csv-import': return db ? $('csvFileInput').click() : toast('Open a database first.');
    case 'theme': return applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    case 'samples': return db ? addSamples() : toast('Open a database first.');
    case 'settings': return db ? settingsModal() : toast('Open a database first.');
    case 'settings-save': {
      const v = parseInt($('setStale').value, 10);
      const prof = { ...reportProfile(), preparer: $('setPreparer').value.trim(), firm: $('setFirm').value.trim(), contact: $('setContact').value.trim(),
        firmPhone: $('setPhone').value.trim(), firmEmail: $('setEmail').value.trim(), firmAddress: $('setAddress').value.trim(),
        signature: $('setSignature').value.replace(/\s+$/, ''), respondDays: parseInt($('setRespond').value, 10) || 10 };
      const beta = $('setBeta').checked ? '1' : '0';
      closeModal();
      mutate('Change settings', () => { if (v >= 1) setSetting('stale_months', v); setSetting('report_profile', JSON.stringify(prof)); setSetting('beta', beta); });
      return;
    }
    case 'undo': return undo();
    case 'r2-manage': closeModal(); return r2ManageModal(null);
    case 'year-prev': case 'year-next': case 'year-today':
      ui.year = action === 'year-today' ? TODAY_YEAR : ui.year + (action === 'year-prev' ? -1 : 1);
      LS.set('rt.year', ui.year); return render();
    case 'mode': if (progressMode() !== el.dataset.mode) mutate('Change progress mode', () => setSetting('progress_mode', el.dataset.mode)); return;
    case 'open-overview': ui.clientId = null; return render();
    case 'open-client': ui.clientId = +el.dataset.id; $('main').scrollTop = 0; return render();
    case 'client-new': return db && clientModal();
    case 'client-edit': return clientModal(ui.clientId);
    case 'client-save': return saveClientFromModal(el.dataset.id ? +el.dataset.id : null);
    case 'client-delete': {
      const c = one('SELECT * FROM clients WHERE id = ?', [ui.clientId]);
      const n = one('SELECT COUNT(*) AS n FROM accounts WHERE client_id = ?', [c.id]).n;
      if (!confirm(`Delete "${c.name}" and its ${n} account(s), check registers and payroll, including every year of history?\n\nTip: "Edit client → Archived" hides a client without deleting it.`)) return;
      mutate(`Delete client "${c.name}"`, () => deleteClientCascade(c.id));
      ui.clientId = null; render();
      return toast(`Deleted "${c.name}".`, 'Undo', undo, 6000);
    }
    case 'acc-new': return accountModal(ui.clientId);
    case 'acc-edit': return accountModal(null, accId);
    case 'acc-save': return saveAccountFromModal(+el.dataset.client, accId);
    case 'acc-delete': {
      const a = one('SELECT * FROM accounts WHERE id = ?', [accId]);
      if (!confirm(`Delete account "${a.name}" with all of its history and check registers?\n\nTip: set a "Closed" month instead to stop tracking it but keep history.`)) return;
      mutate(`Delete account "${a.name}"`, () => deleteAccountCascade(accId));
      return toast(`Deleted "${a.name}".`, 'Undo', undo, 6000);
    }
    case 'toggle-acc': {
      const key = el.dataset.acc === 'payroll' ? 'payroll' : accId;
      ui.collapsed.has(key) ? ui.collapsed.delete(key) : ui.collapsed.add(key);
      return renderMain();
    }
    case 'collapse-all': getAccounts(ui.clientId).forEach(a => ui.collapsed.add(a.id)); ui.collapsed.add('payroll'); return renderMain();
    case 'expand-all': getAccounts(ui.clientId).forEach(a => ui.collapsed.delete(a.id)); ui.collapsed.delete('payroll'); return renderMain();
    case 'toggle-rec': {
      const m = +el.dataset.m;
      const a = one('SELECT * FROM accounts WHERE id = ?', [accId]);
      const p = getPeriod(accId, ui.year, m);
      if (!p.reconciled && !docsEntered(a, p) &&
          !confirm(`${MONTHS_LONG[m]}: ${a.has_gl ? "the statement or GL isn't" : "the statement isn't"} entered yet.\nMark it reconciled anyway?`)) return;
      return mutate(`${p.reconciled ? 'Unmark' : 'Mark'} ${a.name} ${MONTHS[m]} reconciled`, () => setPeriod(accId, ui.year, m, { reconciled: p.reconciled ? 0 : 1 }));
    }
    case 'month': return monthModal(accId, +el.dataset.m);
    case 'toggle-skip': {
      const a = one('SELECT name FROM accounts WHERE id = ?', [accId]);
      return mutate(`${a.name} ${MONTHS[+el.dataset.m]} tracked again`, () => setPeriod(accId, ui.year, +el.dataset.m, { skipped: 0 }));
    }
    case 'month-save': return saveMonthFromModal(accId, +el.dataset.m);
    case 'month-nav': {
      const cur = +$('modalRoot').querySelector('[data-action="month-save"]').dataset.m;
      return saveMonthFromModal(accId, cur, +el.dataset.m);
    }
    case 'fill': return fillModal(accId);
    case 'fill-apply': return applyFill(accId);
    case 'checks': return checkRegisterModal(accId, el.dataset.series ? +el.dataset.series : null);
    case 'chk-tab': ui.modal.input = $('chkInput').value; return checkRegisterModal(ui.modal.accId, +el.dataset.series, true);
    case 'chk-apply': return checkApply(el.dataset.op);
    case 'chk-stmt': return stmtClearModal(ui.modal.accId);
    case 'chk-qbo': return qboImportModal(ui.modal.accId);
    case 'chk-qbo-apply': return qboApply();
    case 'chk-qbo-file': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv,.txt,text/csv,text/plain';
      inp.onchange = async () => { const f = inp.files[0]; if (!f) return; $('qbText').value = await f.text(); $('qbText').dispatchEvent(new Event('input')); };
      inp.click(); return;
    }
    case 'chk-stmt-back': { const st = ui.modal; return checkRegisterModal(st.accId, st.backSeries); }
    case 'chk-stmt-apply': return stmtApply();
    case 'chk-stmt-file': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv,.txt,text/csv,text/plain';
      inp.onchange = async () => { const f = inp.files[0]; if (!f) return; $('stText').value = await f.text(); $('stText').dispatchEvent(new Event('input')); };
      inp.click(); return;
    }
    case 'chk-cycle': return checkCycle(+el.dataset.n);
    case 'chk-fill-gaps': {
      const s = one('SELECT * FROM check_series WHERE id = ?', [ui.modal.seriesId]);
      $('chkInput').value = compressNums(seriesSummary(s, getChecks(s.id)).gaps).replace(/–/g, '-');
      $('chkInput').dispatchEvent(new Event('input')); $('chkInput').focus(); return;
    }
    case 'series-new': return seriesModal(ui.modal ? ui.modal.accId : accId);
    case 'series-edit': return seriesModal(ui.modal.accId, +el.dataset.series);
    case 'series-save': return saveSeriesFromModal(accId, el.dataset.series ? +el.dataset.series : null);
    case 'series-cancel': return checkRegisterModal(accId, el.dataset.series ? +el.dataset.series : null);
    case 'series-delete': {
      const s = one('SELECT * FROM check_series WHERE id = ?', [+el.dataset.series]);
      if (!confirm(`Delete the "${s.label}" series and every check recorded in it?`)) return;
      closeModal();
      mutate(`Delete series "${s.label}"`, () => {
        run('UPDATE payroll_setup SET check_series_id = NULL WHERE check_series_id = ?', [s.id]);
        run('DELETE FROM checks WHERE series_id = ?', [s.id]);
        run('DELETE FROM check_series WHERE id = ?', [s.id]);
      });
      if (getSeries(accId).length) checkRegisterModal(accId);
      return;
    }
    case 'pay-setup': return payrollSetupModal(ui.clientId);
    case 'pay-setup-save': return savePayrollSetup(+el.dataset.id);
    case 'pay-bulk': return payBulkModal(ui.clientId);
    case 'pay-bulk-apply': return applyPayBulk(ui.clientId);
    case 'pay-cycle': {
      const d = el.dataset.date, map = payRunMap(ui.clientId, ui.year);
      const next = PAY_STATUSES[(PAY_RANK[runStatus(map, d)] + 1) % PAY_STATUSES.length].v;
      return mutate(`Payroll ${d} → ${payLabel(next)}`, () => setRun(ui.clientId, d, next));
    }
    case 'report-all': return (betaOn() ? report2Modal : reportModal)(getClients(false).map(c => c.id));
    case 'report-client': return (betaOn() ? report2Modal : reportModal)([ui.clientId]);
    case 'r2-legacy': { const ids = ui.modal.clientIds; closeModal(); return reportModal(ids); }
    case 'r2-save': return r2Save(el.dataset.to);
    case 'r2-make-default': return r2MakeDefault();
    case 'r2-email': return r2EmailModal();
    case 'r2-email-back': return r2Back(ui.modal.back);
    case 'r2-manage-back': { const ids = ui.modal.back; return report2Modal(ids); }
    case 'r2-logo-remove': return mutate('Remove letterhead logo', () => setSetting('report_logo', ''));
    case 'rp-save-default': return saveReportDefault(false);
    case 'rp-save-client': return saveReportDefault(true);
    case 'rp-reset': { const st = ui.modal; st.cfg = JSON.parse(JSON.stringify(REPORT_TEMPLATES[st.cfg.key])); st.cfg.key = Object.keys(REPORT_TEMPLATES).find(k => REPORT_TEMPLATES[k].label === st.cfg.label); st.cfg.headings = {}; return renderReportModal(); }
    case 'rp-copy': return copyReportText();
    case 'print': return window.print();
    case 'modal-close': return closeModal();
    case 'modal-backdrop': if (ev.target === el) closeModal(); return;
    case 'builder-add': {
      $('builderRows').insertAdjacentHTML('beforeend', builderRowHTML(el.dataset.type, el.dataset.name));
      const rows = $('builderRows').querySelectorAll('.b-name'); rows[rows.length - 1].select(); return;
    }
    case 'builder-remove': el.closest('.builder-row').remove(); return;
  }
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if (!ev.target.closest('.menu-wrap')) $('fileMenu').classList.remove('open');
  if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  if (el.closest('.menu')) $('fileMenu').classList.remove('open');
  handleAction(el.dataset.action, el, ev).catch(e => { console.error(e); alert(e.message || e); });
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.matches('select[data-action="status"]')) {
    const accId = +el.dataset.acc, m = +el.dataset.m, field = el.dataset.field;
    const a = one('SELECT name FROM accounts WHERE id = ?', [accId]);
    mutate(`${a.name} ${MONTHS[m]} ${field === 'gl_status' ? 'GL' : 'statement'} → ${statusLabel(el.value)}`, () => setPeriod(accId, ui.year, m, { [field]: el.value }));
  } else if (el.matches('input[data-action="q-flag"]')) {
    const qn = +el.dataset.q, f = el.dataset.field;
    mutate(`Payroll Q${qn} ${f}`, () => setQuarter(ui.clientId, ui.year, qn, { [f]: el.checked ? 1 : 0 }));
  } else if (el.matches('input[data-action="y-flag"]')) {
    mutate(`Payroll ${ui.year} ${el.dataset.field}`, () => setPayYear(ui.clientId, ui.year, { [el.dataset.field]: el.checked ? 1 : 0 }));
  } else if (el.matches('input[data-action="q-money"]')) {
    const c = parseMoney(el.value);
    if (Number.isNaN(c)) { el.classList.add('bad'); return toast('That amount isn’t a valid number.'); }
    mutate(`Payroll Q${el.dataset.q} wages`, () => setQuarter(ui.clientId, ui.year, +el.dataset.q, { [el.dataset.field]: c }));
  }
});
$('saveChip').addEventListener('click', () => actSaveChipClick().catch(e => alert(e.message)));
$('clientSearch').addEventListener('input', e => { ui.search = e.target.value; renderSidebar(); });
$('clientSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const first = $('clientList').querySelector('[data-action="open-client"]'); if (first) first.click(); }
  if (e.key === 'Escape') { e.target.value = ''; ui.search = ''; renderSidebar(); }
});
$('showArchived').addEventListener('change', e => { ui.showArchived = e.target.checked; render(); });
$('dbFileInput').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) openDbFromInput(f); });
$('csvFileInput').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) importCSVText(await f.text()); });

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === 'Escape' && modalOpen()) closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && db) { e.preventDefault(); $('clientSearch').focus(); $('clientSearch').select(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing && db) { e.preventDefault(); undo(); }
  if (e.key === 'Enter' && modalOpen() && document.activeElement?.tagName === 'INPUT' && document.activeElement.type !== 'checkbox'
      && !document.activeElement.closest('.builder-row') && !(ui.modal && ['checks', 'report', 'chkqbo', 'chkstmt', 'report2', 'r2manage', 'r2email'].includes(ui.modal.kind))) {
    const primary = $('modalRoot').querySelector('.modal-footer .btn.primary'); if (primary) { e.preventDefault(); primary.click(); }
  }
});
window.addEventListener('beforeunload', e => {
  if (pendingSave || ((storageMode === 'file' || storageMode === 'server') && lastSaveError)) { saveNow(); e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && pendingSave) saveNow(); });

boot().then(() => { if (db) maybeOfferLegacyImport(); });
</script>
