<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconciliation Tracker</title>
<!-- The SQLite engine (sql.js) is loaded by boot(): first from a sql-asm.js file next to this page
     (works offline / on locked-down networks), then from public CDNs. -->
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f8f9fb; --surface-3: #eef0f3;
    --text: #141821; --muted: #667085; --border: #e3e6eb; --border-strong: #cfd4dc;
    --primary: #2563eb; --primary-hover: #1d4ed8; --primary-weak: #e8efff;
    --danger: #dc2626; --danger-weak: #fdecec;
    --warn: #d97706; --warn-weak: #fff4e0;
    --ok: #059669; --ok-weak: #e3f6ee;
    --bank: #2563eb; --bank-weak: #e8efff;
    --liab: #9333ea; --liab-weak: #f3e8ff;
    --pay: #0d9488; --pay-weak: #ddf5f2;
    --today: #eef4ff;
    --st-not_received-bg: #fde8e8; --st-not_received-fg: #9b1c1c;
    --st-received-bg: #fef3c7;     --st-received-fg: #92400e;
    --st-scanned-bg: #dbeafe;      --st-scanned-fg: #1e40af;
    --st-entered_no_scan-bg: #ffedd5; --st-entered_no_scan-fg: #c2410c;
    --st-entered-bg: #d1fae5;      --st-entered-fg: #065f46;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --shadow-lg: 0 12px 32px rgba(16,24,40,.18);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0e1320; --surface: #171e2e; --surface-2: #1c2436; --surface-3: #232d42;
    --text: #eef1f6; --muted: #98a2b3; --border: #2a3448; --border-strong: #3a465e;
    --primary: #4f8cff; --primary-hover: #74a3ff; --primary-weak: #1b2b4d;
    --danger: #f05252; --danger-weak: #3d1a1d;
    --warn: #f0a32a; --warn-weak: #3a2a10;
    --ok: #31c48d; --ok-weak: #11352a;
    --bank: #4f8cff; --bank-weak: #1b2b4d;
    --liab: #b77cf6; --liab-weak: #2f1d48;
    --pay: #2dd4bf; --pay-weak: #0f3532;
    --today: #1a2742;
    --st-not_received-bg: #4a1d1f; --st-not_received-fg: #fca5a5;
    --st-received-bg: #4a3510;     --st-received-fg: #fcd34d;
    --st-scanned-bg: #1e3266;      --st-scanned-fg: #93c5fd;
    --st-entered_no_scan-bg: #4d2610; --st-entered_no_scan-fg: #fdba74;
    --st-entered-bg: #0f3d2e;      --st-entered-fg: #6ee7b7;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; display: flex; flex-direction: column; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface-3); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .icon-btn { border: none; background: transparent; cursor: pointer; padding: 4px 8px; border-radius: 6px; color: var(--muted); font-size: 16px; }
  .icon-btn:hover { background: var(--surface-3); color: var(--text); }
  .link { border: none; background: none; color: var(--primary); cursor: pointer; padding: 0; font-weight: 600; }
  .link:hover { text-decoration: underline; }

  /* Top bar */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .topbar h1 { font-size: 17px; margin: 0 8px 0 0; font-weight: 650; }
  .spacer { flex: 1; }
  .year-nav { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .year-nav button { border: none; background: var(--surface); padding: 6px 10px; cursor: pointer; }
  .year-nav button:hover { background: var(--surface-2); }
  .year-nav .yr { font-weight: 700; color: var(--primary); min-width: 58px; text-align: center; font-size: 15px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; background: var(--surface); padding: 6px 10px; cursor: pointer; font-size: 12px; font-weight: 500; }
  .seg button.on { background: var(--primary-weak); color: var(--primary); font-weight: 650; }
  .save-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); cursor: default; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .save-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .save-chip.ok .dot { background: var(--ok); }
  .save-chip.saving .dot { background: var(--warn); }
  .save-chip.warn { background: var(--warn-weak); border-color: var(--warn); cursor: pointer; }
  .save-chip.warn .dot { background: var(--warn); }
  .save-chip.err { background: var(--danger-weak); border-color: var(--danger); cursor: pointer; }
  .save-chip.err .dot { background: var(--danger); }

  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; min-width: 250px; z-index: 50; display: none; }
  .menu.open { display: block; }
  .menu button { display: flex; width: 100%; gap: 10px; align-items: center; border: none; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 13px; }
  .menu button:hover { background: var(--surface-2); }
  .menu hr { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
  .menu .menu-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 10px 2px; }

  /* Layout */
  .layout { flex: 1; display: flex; min-height: 0; }
  .sidebar { width: 268px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .sidebar-head { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
  .search { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); outline: none; }
  .search:focus { border-color: var(--primary); }
  .client-list { flex: 1; overflow-y: auto; padding: 6px; }
  .client-item { display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; border: none; background: none; cursor: pointer; margin-bottom: 2px; }
  .client-item:hover { background: var(--surface-2); }
  .client-item.active { background: var(--primary-weak); }
  .client-item.archived { opacity: .55; }
  .client-item .ci-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .client-item .ci-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .client-item .ci-sub { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
  .badges { display: inline-flex; gap: 4px; }
  .badge-issue, .badge-due { font-size: 10px; font-weight: 700; color: #fff; border-radius: 999px; padding: 1px 6px; }
  .badge-issue { background: var(--danger); }
  .badge-due { background: var(--warn); }
  .sidebar-foot { padding: 10px 12px; border-top: 1px solid var(--border); font-size: 12px; }

  .main { flex: 1; min-width: 0; overflow: auto; }
  .main-inner { padding: 20px 24px 40px; }
  .main-inner.wide { min-width: 1180px; }

  /* Progress */
  .prog { display: inline-flex; align-items: center; gap: 8px; }
  .prog-track { position: relative; width: 120px; height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; flex-shrink: 0; }
  .prog-track.sm { width: 70px; height: 6px; }
  .prog-track.lg { width: 220px; height: 10px; }
  .prog-rec, .prog-ready { position: absolute; top: 0; bottom: 0; }
  .prog-rec { left: 0; background: var(--ok); }
  .prog-ready { background: var(--primary); opacity: .35; }
  .prog-label { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .prog-label b { color: var(--text); }

  /* Client view */
  .client-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
  .client-head h2 { margin: 0; font-size: 22px; }
  .client-notes { color: var(--muted); margin-top: 4px; white-space: pre-wrap; max-width: 700px; }
  .client-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .group-head { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; }
  .group-head h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .group-head.bank h3 { color: var(--bank); }
  .group-head.liability h3 { color: var(--liab); }
  .group-head.payroll h3 { color: var(--pay); }
  .group-head .line { flex: 1; height: 1px; background: var(--border); }
  .notice { border: 1px solid var(--warn); background: var(--warn-weak); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
  .notice b { display: block; margin-bottom: 4px; }
  .notice ul { margin: 0; padding-left: 18px; }

  .acc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .acc-card.bank { border-left: 4px solid var(--bank); }
  .acc-card.liability { border-left: 4px solid var(--liab); }
  .acc-card.payroll { border-left: 4px solid var(--pay); }
  .acc-card.inactive-acc { opacity: .7; }
  .acc-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface-2); flex-wrap: wrap; }
  .acc-toggle { border: none; background: none; cursor: pointer; color: var(--muted); width: 18px; padding: 0; font-size: 11px; transition: transform .15s; }
  .acc-card.collapsed .acc-toggle { transform: rotate(-90deg); }
  .acc-card.collapsed .acc-body { display: none; }
  .acc-name { font-weight: 650; }
  .type-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .type-badge.bank { background: var(--bank-weak); color: var(--bank); }
  .type-badge.liability { background: var(--liab-weak); color: var(--liab); }
  .type-badge.payroll { background: var(--pay-weak); color: var(--pay); }
  .acc-meta { font-size: 12px; color: var(--muted); }
  .acc-actions { margin-left: auto; display: flex; gap: 6px; }
  .acc-foot { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 12px; background: var(--surface-2); flex-wrap: wrap; }

  .acc-grid { display: grid; grid-template-columns: 170px repeat(12, minmax(74px, 1fr)); }
  .acc-grid > div { padding: 6px 4px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: center; min-height: 40px; }
  .acc-grid .rl { justify-content: flex-start; padding-left: 14px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .acc-grid .rl.strong { color: var(--text); font-weight: 650; }
  .acc-grid .mh { font-size: 11px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; min-height: 30px; }
  .acc-grid .today { background: var(--today); }
  .acc-grid .rec-row { background: var(--surface-2); }
  .acc-grid .rec-row.today { background: var(--today); }
  .mh-btn { border: none; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; padding: 3px 6px; border-radius: 5px; display: inline-flex; align-items: center; gap: 3px; }
  .mh-btn:hover { background: var(--surface-3); color: var(--text); }
  .mh-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .mh-dot.bad { background: var(--danger); }
  .mh-ye { color: var(--warn); font-size: 12px; }
  .od select.st { box-shadow: 0 0 0 2px var(--danger); }

  select.st { width: 100%; padding: 6px 2px; border-radius: 6px; border: none; font-size: 11px; font-weight: 650; cursor: pointer; outline: none; appearance: none; -webkit-appearance: none; text-align: center; text-align-last: center; }
  select.st:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  select.st option { background: var(--surface); color: var(--text); }
  .st-not_received { background: var(--st-not_received-bg); color: var(--st-not_received-fg); }
  .st-received { background: var(--st-received-bg); color: var(--st-received-fg); }
  .st-scanned { background: var(--st-scanned-bg); color: var(--st-scanned-fg); }
  .st-entered_no_scan { background: var(--st-entered_no_scan-bg); color: var(--st-entered_no_scan-fg); }
  .st-entered { background: var(--st-entered-bg); color: var(--st-entered-fg); }
  .na { color: var(--muted); font-size: 12px; opacity: .6; }

  .rec-btn { width: 100%; padding: 5px 4px; border-radius: 999px; font-weight: 700; font-size: 11px; cursor: pointer; border: 1px solid transparent; background: transparent; }
  .rec-ready { border-color: var(--primary); color: var(--primary); }
  .rec-ready:hover { background: var(--primary); color: #fff; }
  .rec-pending { border-color: var(--warn); color: var(--warn); background: var(--warn-weak); }
  .rec-blocked { border-color: var(--border); color: var(--muted); }
  .rec-blocked:hover { border-color: var(--border-strong); color: var(--text); }
  .rec-done { background: var(--ok); color: #fff; }
  .rec-scan { background: var(--warn); color: #fff; }
  .rec-ghost { background: var(--danger); color: #fff; }
  .mpick { display: inline-flex; gap: 6px; align-items: center; }
  .mpick .mp-sel { width: auto; padding: 7px 8px; }
  .mpick .mp-sel.compact { padding: 4px 6px; font-size: 12px; }
  .field .mpick { display: flex; }
  .field .mpick .mp-m { flex: 1 1 auto; min-width: 0; }
  .rec-skip { border: 1px dashed var(--border-strong); color: var(--muted); font-weight: 600; }
  .rec-skip:hover { border-color: var(--text); color: var(--text); }
  .acc-grid .skip-cell { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--surface-3) 6px 7px); }
  .q-cell.na { color: var(--muted); background: repeating-linear-gradient(135deg, transparent 0 6px, var(--surface-3) 6px 7px); }

  /* Overview */
  .ov-table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
  .ov-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
  .ov-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .ov-table tr:last-child td { border-bottom: none; }
  .ov-table tbody tr { cursor: pointer; }
  .ov-table tbody tr:hover td { background: var(--surface-2); }
  .pill { display: inline-block; font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.bank { background: var(--bank-weak); color: var(--bank); }
  .pill.liability { background: var(--liab-weak); color: var(--liab); }
  .pill.payroll { background: var(--pay-weak); color: var(--pay); }
  .pill.ready { background: var(--primary-weak); color: var(--primary); }
  .pill.issue { background: var(--danger-weak); color: var(--danger); }
  .pill.due { background: var(--warn-weak); color: var(--warn); }
  .pill.ok { background: var(--ok-weak); color: var(--ok); }
  .pill.plain { background: var(--surface-3); color: var(--muted); }
  .stat-row { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 150px; box-shadow: var(--shadow); }
  .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .stat .v { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* Banners / welcome */
  .banner { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: var(--warn-weak); border-bottom: 1px solid var(--warn); font-size: 13px; }
  .welcome { max-width: 620px; margin: 8vh auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; box-shadow: var(--shadow); }
  .welcome h2 { margin: 0 0 6px; }
  .welcome .choices { display: grid; gap: 10px; margin-top: 22px; }
  .choice { display: flex; gap: 14px; align-items: center; text-align: left; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; }
  .choice:hover { border-color: var(--primary); background: var(--primary-weak); }
  .choice .ic { font-size: 22px; }
  .choice b { display: block; }
  .choice small { color: var(--muted); }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(10,14,22,.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal { background: var(--surface); width: 100%; max-width: 560px; border-radius: 12px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); display: flex; flex-direction: column; max-height: 92vh; }
  .modal.wide { max-width: 880px; }
  .modal.xwide { max-width: 1060px; }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .modal-header h2 { font-size: 17px; margin: 0; }
  .modal-body { padding: 20px; overflow-y: auto; }
  .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--surface-2); border-radius: 0 0 12px 12px; align-items: center; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 12px; font-weight: 650; color: var(--muted); margin-bottom: 5px; }
  .input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); outline: none; }
  .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-weak); }
  .input.bad { border-color: var(--danger); }
  input.money { text-align: right; font-variant-numeric: tabular-nums; }
  textarea.input { resize: vertical; min-height: 56px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 18px 0 10px; padding-top: 14px; border-top: 1px solid var(--border); }
  .type-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .type-col { border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .type-col h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .type-col.bank h4 { color: var(--bank); }
  .type-col.liability h4 { color: var(--liab); }
  .type-opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .type-opt:hover { background: var(--surface-2); }
  .type-opt input { margin: 0; }
  .builder-row { display: grid; grid-template-columns: 1fr 170px 70px 30px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .builder-head { display: grid; grid-template-columns: 1fr 170px 70px 30px; gap: 8px; font-size: 11px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px dashed var(--border-strong); background: none; cursor: pointer; }
  .chip.bank:hover { border-color: var(--bank); color: var(--bank); background: var(--bank-weak); }
  .chip.liability:hover { border-color: var(--liab); color: var(--liab); background: var(--liab-weak); }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 13px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }

  /* Check register */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }

  .bulk textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; min-height: 46px; }
  .preview { font-size: 12px; margin-top: 6px; min-height: 18px; }
  .chk-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .chk-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .chk-legend span { display: inline-flex; gap: 5px; align-items: center; }
  .chk-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid var(--border); padding: 0; }
  .chk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 4px; }
  .chk { font-size: 11px; padding: 5px 0; border-radius: 5px; border: 1px solid var(--border); text-align: center; cursor: pointer; background: var(--surface); font-variant-numeric: tabular-nums; }
  .chk:hover { border-color: var(--text); }
  .chk.entered { background: var(--primary-weak); border-color: var(--primary); color: var(--primary); font-weight: 650; }
  .chk.cleared { background: var(--ok-weak); border-color: var(--ok); color: var(--ok); font-weight: 650; }
  .chk.void { background: var(--surface-3); color: var(--muted); text-decoration: line-through; }
  .chk.gap { border: 1px dashed var(--danger); color: var(--danger); }
  .chk.stale { box-shadow: inset 0 0 0 2px var(--warn); }
  .chk-block-label { grid-column: 1 / -1; font-size: 11px; color: var(--muted); font-weight: 650; margin-top: 6px; }
  .lists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
  .list-box { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12px; max-height: 170px; overflow: auto; }
  .list-box h4 { margin: 0 0 6px; font-size: 12px; }

  /* Payroll */
  .pay-week { display: flex; flex-direction: column; gap: 3px; width: 100%; }
  .pw { width: 100%; border-radius: 5px; border: 1px solid transparent; font-size: 11px; font-weight: 650; padding: 3px 0; cursor: pointer; font-variant-numeric: tabular-nums; }
  .pw.not_received { background: var(--st-not_received-bg); color: var(--st-not_received-fg); }
  .pw.received { background: var(--st-received-bg); color: var(--st-received-fg); }
  .pw.entered { background: var(--st-scanned-bg); color: var(--st-scanned-fg); }
  .pw.tied { background: var(--st-entered-bg); color: var(--st-entered-fg); }
  .pw.future { background: var(--surface-3); color: var(--muted); }
  .pw.none { background: transparent; color: var(--muted); border: 1px dashed var(--border-strong); text-decoration: line-through; }
  .pw.od { box-shadow: 0 0 0 2px var(--danger); }
  .acc-grid.tall > div { align-items: flex-start; }
  .q-grid { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--border); }
  .q-cell { padding: 10px 12px; border-right: 1px solid var(--border); font-size: 12px; }
  .q-cell:last-child { border-right: none; }
  .q-cell h4 { margin: 0 0 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
  .q-cell .check { margin-bottom: 5px; font-size: 12px; }
  .q-cell.od { background: var(--danger-weak); }
  .q-wages { display: grid; grid-template-columns: auto 1fr; gap: 4px 6px; align-items: center; margin-top: 6px; }
  .q-wages input { padding: 3px 6px; font-size: 12px; border-radius: 5px; }

  /* Report */
  #reportContent { font-size: 14px; }
  .rep-meta { color: var(--muted); font-size: 13px; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px solid var(--border); }
  .rep-client { border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 16px; background: var(--surface); }
  .rep-client h3 { margin: 0 0 10px; color: var(--primary); font-size: 17px; }
  .rep-acc { font-weight: 650; margin: 12px 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rep-list { margin: 0 0 6px; padding-left: 18px; }
  .rep-list li { margin-bottom: 4px; }
  .rep-list .m { font-weight: 650; display: inline-block; min-width: 46px; }
  .rep-bad { color: var(--danger); background: var(--danger-weak); border-left: 4px solid var(--danger); padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
  .rep-minor { color: var(--warn); background: var(--warn-weak); border-left: 4px solid var(--warn); padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
  .rep-good { text-align: center; padding: 30px; color: var(--ok); background: var(--ok-weak); border-radius: 8px; font-weight: 650; }


  /* Report builder + paper (black & white friendly) */
  .rp-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
  .rp-controls { font-size: 13px; position: sticky; top: 0; }
  .rp-controls .check { margin-bottom: 6px; font-size: 13px; }
  .rp-controls textarea.input { font-size: 12px; }
  .rp-paper { background: #fff; color: #111; border: 1px solid var(--border); border-radius: 6px; padding: 36px 44px; font: 13px/1.55 Georgia, "Times New Roman", serif; min-height: 400px; }
  .rp-page + .rp-page { border-top: 1px dashed #aaa; margin-top: 32px; padding-top: 32px; }
  .rp-letterhead { display: flex; justify-content: space-between; gap: 20px; font: 12px/1.4 -apple-system, "Segoe UI", sans-serif; border-bottom: 1.5px solid #111; padding-bottom: 8px; margin-bottom: 22px; }
  .rp-to { margin-bottom: 14px; font-weight: 700; }
  .rp-title { font-size: 17px; font-weight: 700; margin: 0 0 6px; }
  .rp-meta { font: 12px -apple-system, "Segoe UI", sans-serif; color: #444; margin-bottom: 16px; }
  .rp-text p { margin: 0 0 10px; }
  .rp-closing { margin-top: 22px; }
  .rp-sec h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid #888; padding-bottom: 3px; margin: 20px 0 8px; }
  .rp-list { list-style: none; margin: 0; padding: 0; }
  .rp-list li { position: relative; padding-left: 22px; margin: 4px 0; }
  .rp-list li::before { content: "•"; position: absolute; left: 7px; }
  .rp-list.boxes li::before { content: "☐"; left: 0; font-size: 15px; line-height: 1.25; }
  .rp-flag { font-weight: 700; letter-spacing: .02em; }
  .rp-note { font-style: italic; }
  /* ---------- Beta report editor ---------- */
  .r2-wrap { display: grid; grid-template-columns: 440px 1fr; gap: 0; margin: -20px; min-height: 70vh; }
  .r2-left { border-right: 1px solid var(--border); padding: 14px 16px 24px; overflow-y: auto; max-height: calc(92vh - 140px); }
  .r2-right { background: var(--surface-3); padding: 16px; overflow: auto; max-height: calc(92vh - 140px); }
  .r2-top { display: grid; gap: 10px; padding-bottom: 12px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
  .r2-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lbl { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; color: var(--muted); margin: 0 0 4px; }
  .r2-savebar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; }
  .r2-savebar .btn:disabled { opacity: .45; }
  .r2-seg button { padding: 5px 9px; }
  .r2-acc { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 10px; background: var(--surface); }
  .r2-acc > summary { list-style: none; cursor: pointer; padding: 9px 12px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .r2-acc > summary::-webkit-details-marker { display: none; }
  .r2-acc > summary::before { content: "▸"; color: var(--muted); font-size: 11px; transition: transform .15s; }
  .r2-acc[open] > summary::before { transform: rotate(90deg); }
  .r2-acc-body { padding: 8px 12px 12px; border-top: 1px solid var(--border); }
  .r2-field { margin-bottom: 10px; }
  .r2-field textarea.input { font-size: 13px; min-height: 38px; }
  .r2-chk { font-size: 13px; margin: 4px 0 8px; }
  .r2-tag { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
  .r2-tag .src, .src { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
  .src.edited { background: var(--primary-weak); color: var(--primary); }
  .src.client { background: var(--warn-weak); color: var(--warn); }
  .src.uses { color: var(--muted); border: 1px solid var(--border); }
  .reset { border: none; background: none; color: var(--primary); cursor: pointer; font-size: 11px; padding: 0; font-weight: 600; }
  .r2-ins { border: 1px dashed var(--border-strong); background: none; border-radius: 6px; font-size: 11px; padding: 0 6px; cursor: pointer; color: var(--muted); }
  .r2-tag + .r2-ins { margin-left: 0; }
  .lbl > .r2-ins:only-of-type { margin-left: auto; }
  .r2-ins:hover { border-color: var(--primary); color: var(--primary); }
  .r2-dot { display: inline-flex; }
  .r2-d { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: none; padding: 0; }
  .r2-d.edited { background: var(--primary); }
  .r2-d.client { background: var(--warn); cursor: pointer; }
  .r2-cmp { font-size: 12px; color: var(--muted); background: var(--surface-3); border-radius: 6px; padding: 5px 8px; margin-top: 4px; white-space: pre-wrap; }
  .r2-cmp b { color: var(--text); font-weight: 600; }
  .r2-card { border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; margin-bottom: 10px; background: var(--surface-2); }
  .r2-card.off .r2-card-body { opacity: .45; }
  .r2-card-head { display: flex; align-items: center; gap: 6px; }
  .r2-card-head .r2-chk { margin: 0; }
  .r2-card-body { margin-top: 6px; }
  .r2-drag { color: var(--muted); cursor: grab; }
  .r2-card.drop-before { box-shadow: 0 -3px 0 var(--primary); }
  .r2-card.drop-after { box-shadow: 0 3px 0 var(--primary); }
  .r2-card.dragging { opacity: .4; }
  .r2-kind.off textarea, .r2-kind.off .r2-kvars { opacity: .4; }
  .r2-kvars { margin-top: 2px; }
  .r2-kvars code { font-size: 10.5px; color: var(--muted); }
  .r2-flash { animation: r2flash 1s ease; }
  @keyframes r2flash { 0% { box-shadow: 0 0 0 4px var(--primary); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .r2-vg { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; margin: 8px 0 4px; }
  .r2-var { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; padding: 4px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .r2-var:hover { background: var(--primary-weak); border-color: var(--primary); }
  .r2-var code { font-size: 12px; color: var(--primary); font-weight: 650; }
  .r2-val { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r2-help { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
  .r2-pop { position: fixed; z-index: 150; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); width: 340px; max-height: 360px; overflow-y: auto; padding: 8px; display: none; }
  .r2-pop.open { display: block; }
  .r2-pop input { margin-bottom: 6px; }
  .r2-bar { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .r2-excl { max-width: 740px; margin: 0 auto 10px; background: var(--surface); border: 1px dashed var(--border-strong); border-radius: 8px; padding: 8px 12px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .r2-xchip { background: var(--surface-3); border-radius: 999px; padding: 2px 4px 2px 10px; display: inline-flex; align-items: center; gap: 4px; }
  .r2-xchip button { border: none; background: none; cursor: pointer; color: var(--primary); font-weight: 700; }
  .r2-paper { background: #fff; color: #111; max-width: 740px; margin: 0 auto; padding: 44px 52px; font: 13.5px/1.6 Georgia, "Times New Roman", serif; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .r2-page + .r2-page { border-top: 1px dashed #aaa; margin-top: 34px; padding-top: 34px; }
  .r2-lh { display: flex; justify-content: space-between; font: 12px/1.45 -apple-system, "Segoe UI", sans-serif; border-bottom: 1.5px solid #111; padding-bottom: 8px; margin-bottom: 20px; }
  .r2-lh-left { justify-content: flex-start; }
  .r2-lh-center { flex-direction: column; align-items: center; text-align: center; }
  .r2-rb { text-align: right; }
  .r2-sub { margin-top: 4px; }
  .r2-logo { height: 46px; max-width: 170px; object-fit: contain; margin-right: 14px; }
  .r2-lh-center .r2-logo { margin: 0 0 6px; }
  .r2-rec { margin-bottom: 4px; }
  .r2-re { margin: 14px 0 0; }
  .r2-title { font-size: 17px; margin: 14px 0 12px; }
  .r2-paper p { margin: 0 0 10px; }
  .r2-sec + .r2-sec { margin-top: 14px; }
  .r2-sec h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid #888; padding-bottom: 3px; margin: 18px 0 6px; }
  .r2-sec h4 { font-size: 13.5px; margin: 12px 0 4px; }
  .r2-lead { margin: 2px 0 4px !important; }
  .r2-list { list-style: none; margin: 4px 0 6px; padding: 0; }
  ol.r2-list { counter-reset: r2n; }
  .r2-list li { position: relative; padding-left: 24px; margin: 4px 0; }
  .r2-b-box li::before { content: "☐"; position: absolute; left: 0; font-size: 15px; line-height: 1.3; }
  .r2-b-dot li::before { content: "•"; position: absolute; left: 7px; }
  ol.r2-list li::before { counter-increment: r2n; content: counter(r2n) "."; position: absolute; left: 0; }
  .r2-b-none li { padding-left: 0; }
  .r2-click { cursor: pointer; border-radius: 3px; }
  .r2-click:hover { outline: 2px dashed var(--primary); outline-offset: 2px; }
  .r2-list li:has(.r2-x) { padding-right: 34px; }
  .r2-x { position: absolute; right: 0; top: 1px; z-index: 2; border: 1px solid #ccc; background: #fff; color: #666; border-radius: 5px; font-size: 11px; line-height: 1; padding: 3px 5px; cursor: pointer; opacity: 0; }
  .r2-list li:hover .r2-x { opacity: 1; }
  .r2-x:hover { color: var(--danger); border-color: var(--danger); }
  @media (hover: none) { .r2-x { opacity: .75; } }
  @media (max-width: 900px) {
    .modal:has(.r2-wrap) .modal-footer { flex-wrap: wrap; justify-content: flex-end; }
    .modal-overlay:has(.r2-wrap) { padding: 6px; }
    .modal:has(.r2-wrap) { max-height: 98vh; }
    .r2-wrap { grid-template-columns: 1fr; min-height: 0; }
    .r2-left, .r2-right { max-height: none; overflow: visible; }
    .r2-left { border-right: none; border-top: 1px solid var(--border); }
    .r2-right { order: -1; padding: 8px; }
    .r2-paper { padding: 22px 18px; }
    .r2-2col { grid-template-columns: 1fr; }
  }
  mark.r2-bad { background: #fde8e8; color: #9b1c1c; border-bottom: 2px wavy #dc2626; padding: 0 2px; }
  .r2-note { font-style: italic; }
  .r2-closing { margin-top: 20px; }
  .r2-diff { border-top: 1px solid var(--border); padding: 8px 0; font-size: 12px; }
  .r2-diff-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .r2-diff-cols div { white-space: pre-wrap; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; }
  .tpl-list { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
  .tpl-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .tpl-row:last-child { border-bottom: none; }
  .beta-badge { font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; background: var(--warn-weak); color: var(--warn); border: 1px solid var(--warn); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 200; box-shadow: var(--shadow-lg); display: flex; gap: 12px; align-items: center; }
  .toast button { background: none; border: none; color: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; }

  @media print {
    @page { margin: .5in; }
    body { display: block; background: #fff !important; color: #000 !important; }
    body > *:not(#modalRoot) { display: none !important; }
    #modalRoot .modal-overlay { position: static; background: none; padding: 0; display: block; }
    #modalRoot .modal { box-shadow: none; border: none; max-width: none; max-height: none; }
    #modalRoot .modal-header, #modalRoot .modal-footer { display: none; }
    #modalRoot .modal-body { overflow: visible; padding: 0; }
    .rep-client { break-inside: avoid; border-color: #bbb; }
    .rep-bad, .rep-minor, .rep-good, .pill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .rp-controls { display: none !important; }
    .rp-wrap { display: block; }
    .rp-paper { border: none; padding: 0; min-height: 0; font-size: 11.5pt; }
    .rp-paper, .rp-paper * { color: #000 !important; background: transparent !important; }
    .rp-page { break-after: page; }
    .rp-page:last-child { break-after: auto; }
    .rp-page + .rp-page { border-top: none; margin-top: 0; padding-top: 0; }
    .rp-sec { break-inside: avoid-page; }
    .r2-wrap { display: block; margin: 0; }
    .r2-right { padding: 0; max-height: none; overflow: visible; background: none !important; }
    .r2-bar, .r2-excl, .r2-x, .r2-pop, mark.r2-bad { display: none !important; }
    .r2-list li:has(.r2-x) { padding-right: 0; }
    .r2-paper { box-shadow: none; padding: 0; max-width: none; }
    .r2-click:hover { outline: none; }
    .r2-page { break-after: page; }
    .r2-page:last-child { break-after: auto; }
    .r2-page + .r2-page { border-top: none; margin-top: 0; padding-top: 0; }
    .r2-sec { break-inside: avoid-page; }
  }
</style>

<body>

<header class="topbar">
  <h1>Reconciliation Tracker</h1>

  <div class="spacer"></div>

    <button class="btn sm" data-action="menu">☰ File</button>
    <div class="menu" id="fileMenu">
      <div class="menu-label">Database</div>
      <button data-action="db-new">🆕 New database file…</button>
      <button data-action="db-open">📂 Open database file…</button>
      <button data-action="db-copy">💾 Download a backup copy (.db)</button>
      <hr>
      <div class="menu-label">Transfer (CSV)</div>
      <button data-action="csv-export" data-kind="accounts">📊 Export accounts &amp; months</button>
      <button data-action="csv-export" data-kind="checks">🧾 Export check registers</button>
      <button data-action="csv-export" data-kind="payroll">👥 Export payroll</button>
      <button data-action="csv-import">📥 Import CSV (merge)…</button>
      <hr>
      <button data-action="settings">⚙️ Settings</button>

    </div>
  </div>
</header>
<div id="bannerRoot"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="btn primary" data-action="client-new">＋ New client</button>
      <input class="search" id="clientSearch" placeholder="Search clients  (Ctrl+K)" autocomplete="off">

/** "1,234.56" / "(1,234.56)" / "-50" / "$12" -> integer cents. '' -> null, junk -> NaN */
function parseMoney(s) {
  s = String(s ?? '').trim();
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[$,\s]/g, '');
  if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
  if (!/^\d*(\.\d{0,2})?$/.test(s) || s === '' || s === '.') return NaN;
  const [w, f = ''] = s.split('.');
  const c = parseInt(w || '0', 10) * 100 + parseInt((f + '00').slice(0, 2), 10);
  return neg ? -c : c;
}
function fmtMoney(c) {
  if (c == null || Number.isNaN(c)) return '';

  return neg ? `(${s})` : s;
}

/* =====================================================================
   IndexedDB key/value (remembers the file handle + a cached copy)
   ===================================================================== */
/* Pages opened from a network share (file://server/...) get an opaque origin in Chrome:
   IndexedDB can hang or throw there. Every call is time-limited and failures turn it off. */
let idbAvailable = true, idbConn = null;
const withTimeout = (p, ms, what) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(`${what} timed out`)), ms))]);
function idbOpen() {
  if (!idbAvailable) return Promise.reject(new Error('IndexedDB unavailable'));
  if (!idbConn) {
    idbConn = withTimeout(new Promise((res, rej) => {
      const r = indexedDB.open('reconTracker', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('IndexedDB blocked'));
    }), 2500, 'IndexedDB').catch(e => { idbAvailable = false; idbConn = null; console.warn('Browser storage unavailable:', e.message); throw e; });
  }
  return idbConn;
}
function idbReq(mode, fn) {
  return idbOpen().then(d => withTimeout(new Promise((res, rej) => {
    const tx = d.transaction('kv', mode);
    const r = fn(tx.objectStore('kv'));
    tx.oncomplete = () => res(r && r.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  }), 4000, 'IndexedDB request'));
}
async function idbGet(key) { try { return await idbReq('readonly', st => st.get(key)); } catch { return undefined; } }
async function idbSet(key, val) { try { await idbReq('readwrite', st => st.put(val, key)); } catch (e) { console.warn('IndexedDB write failed', e.message); } }
async function idbDel(key) { try { await idbReq('readwrite', st => st.delete(key)); } catch {} }

/* localStorage can also throw on opaque origins */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

/* =====================================================================
   SQLite helpers
   ===================================================================== */
function q(sql, params = []) {
  const st = db.prepare(sql);
  try { st.bind(params); const rows = []; while (st.step()) rows.push(st.getAsObject()); return rows; }
  finally { st.free(); }
}
const one = (sql, params) => q(sql, params)[0];
function run(sql, params = []) { db.run(sql, params); }
function lastId() { return one('SELECT last_insert_rowid() AS id').id; }
function getSetting(k, def) { const r = one('SELECT value FROM settings WHERE key = ?', [k]); return r ? r.value : def; }
function setSetting(k, v) { run('INSERT INTO settings(key,value) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET value = excluded.value', [k, String(v)]); }

function ensureColumn(table, col, def) {
  if (!q(`PRAGMA table_info(${table})`).some(r => r.name === col)) run(`ALTER TABLE ${table} ADD COLUMN ${col} ${def}`);
}
/** Brings any older tracker file up to the current schema. Safe to run every time. */
function migrate() {
  ensureColumn('clients', 'uuid', 'TEXT');
  ensureColumn('accounts', 'uuid', 'TEXT');
  ensureColumn('accounts', 'has_gl', 'INTEGER NOT NULL DEFAULT 1');
  ensureColumn('accounts', 'has_checks', 'INTEGER NOT NULL DEFAULT 0');
  ensureColumn('accounts', 'closing_day', 'INTEGER');
  ensureColumn('accounts', 'arrival_days', 'INTEGER NOT NULL DEFAULT 7');
  ensureColumn('periods', 'begin_bal', 'INTEGER');
  ensureColumn('periods', 'end_bal', 'INTEGER');
  ensureColumn('periods', 'gl_bal', 'INTEGER');
  ensureColumn('periods', 'note', "TEXT NOT NULL DEFAULT ''");
  ensureColumn('periods', 'skipped', 'INTEGER NOT NULL DEFAULT 0');
  ensureColumn('clients', 'start_ym', 'TEXT');
  ensureColumn('payroll_quarters', 'skipped', 'INTEGER NOT NULL DEFAULT 0');
  for (const t of ['clients', 'accounts', 'check_series', 'payroll_setup']) {
    const key = t === 'payroll_setup' ? 'client_id' : 'id';
    q(`SELECT ${key} AS k FROM ${t} WHERE uuid IS NULL`).forEach(r => run(`UPDATE ${t} SET uuid = ? WHERE ${key} = ?`, [uuid(), r.k]));
  }
  run('CREATE UNIQUE INDEX IF NOT EXISTS idx_clients_uuid ON clients(uuid)');
  run('CREATE UNIQUE INDEX IF NOT EXISTS idx_accounts_uuid ON accounts(uuid)');
  run('CREATE UNIQUE INDEX IF NOT EXISTS idx_series_uuid ON check_series(uuid)');
  const was = parseInt(getSetting('schema_version', '0'), 10);
  if (was < SCHEMA_VERSION) setSetting('schema_version', SCHEMA_VERSION);
  return was;
}

function openDbFromBytes(bytes) {
  const d = bytes ? new SQL.Database(bytes) : new SQL.Database();
  const tables = new Set();
  const st = d.prepare("SELECT name FROM sqlite_master WHERE type='table'");
  while (st.step()) tables.add(st.getAsObject().name);
  st.free();
  if (tables.size && !tables.has('clients')) { d.close(); throw new Error('This file is a SQLite database, but not a Reconciliation Tracker database.'); }
  if (db) db.close();
  db = d;
  resetCaches();
  run('PRAGMA foreign_keys = ON');
  db.exec(SCHEMA_SQL);
  const was = migrate();
  if (!getSetting('progress_mode')) setSetting('progress_mode', 'ytd');
  if (!getSetting('stale_months')) setSetting('stale_months', 6);
  undoStack.length = 0;
  updateUndoBtn();
  if (was && was < SCHEMA_VERSION) {
    setTimeout(() => toast(`Database upgraded to version ${SCHEMA_VERSION}. All existing data was kept.`), 300);
    scheduleSave();
  }
}

/* =====================================================================
   Persistence
   ===================================================================== */
function setSaveStatus(kind, text, title = '') {
  const chip = $('saveChip');
  chip.className = 'save-chip ' + kind;
  $('saveText').textContent = text;
  chip.title = title;
}
function refreshSaveStatus() {
  if (storageMode === 'server') {
    if (lastSaveError) setSaveStatus('err', lastSaveError === CONFLICT ? 'Changed elsewhere — click to reload' : 'Save failed — click to retry', String(lastSaveError));
    else if (pendingSave) setSaveStatus('saving', 'Saving to server…');
    else setSaveStatus('ok', 'Saved · server', 'Every change is saved to the server automatically.');
  } else if (storageMode === 'file') {
    if (lastSaveError) setSaveStatus('err', 'Save failed — click to retry', String(lastSaveError));
    else if (pendingSave) setSaveStatus('saving', `Saving to ${fileHandle.name}…`);
    else setSaveStatus('ok', `Saved · ${fileHandle.name}`, 'Every change is written to this file automatically.');
  } else if (storageMode === 'browser') {
    setSaveStatus('warn', 'Browser storage only — click to save as a file',
      'Your data is only cached in this browser. Click to save it as a .db file you control.');
  } else setSaveStatus('', 'No database open');
}
function scheduleSave() {
  pendingSave = true;
  refreshSaveStatus();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 400);
}
function exportBytes() {
  const bytes = db.export();
  run('PRAGMA foreign_keys = ON'); // export() reopens the connection, which resets pragmas
  return bytes;
}
function saveNow() {
  clearTimeout(saveTimer);
  if (!db) return Promise.resolve();
  const bytes = exportBytes();
  saveChain = saveChain.then(async () => {
    await idbSet('dbCache', bytes);
    if (storageMode === 'server') {
      await serverSave(bytes);
    } else if (storageMode === 'file' && fileHandle) {
      try {
        const perm = await fileHandle.queryPermission({ mode: 'readwrite' });

    for (let n = a; n <= b; n++) nums.add(n);
  }
  return { nums: [...nums].sort((x, y) => x - y), errors };
}
/** What a bulk action would do to each number. */
function planCheckAction(checks, nums, action, ym) {
  const plan = [];
  for (const n of nums) {
    const c = checks.get(n);
    let next = null;
    if (action === 'entered') {
      if (c && (c.state === 'cleared' || c.state === 'entered')) continue;   // already there or further along
      next = { state: 'entered', entered_ym: ym, cleared_ym: null };
    } else if (action === 'cleared') {
      if (c && c.state === 'cleared' && c.cleared_ym === ym) continue;
      next = { state: 'cleared', entered_ym: (c && c.state !== 'void' && c.entered_ym) || ym, cleared_ym: ym };
    } else if (action === 'void') {
      if (c && c.state === 'void') continue;
      next = { state: 'void', entered_ym: c ? c.entered_ym : ym, cleared_ym: null };
    } else if (action === 'reset') {
      if (!c) continue;
    }
    plan.push({ n, from: c ? c.state : null, next });
  }
  return plan;
}
function applyCheckPlan(seriesId, plan) {
  plan.forEach(({ n, next }) => {
    if (!next) run('DELETE FROM checks WHERE series_id = ? AND number = ?', [seriesId, n]);
    else run(`INSERT INTO checks (series_id, number, state, entered_ym, cleared_ym, updated_at) VALUES (?,?,?,?,?, datetime('now'))
              ON CONFLICT(series_id, number) DO UPDATE SET state = excluded.state, entered_ym = excluded.entered_ym,
              cleared_ym = excluded.cleared_ym, updated_at = excluded.updated_at`, [seriesId, n, next.state, next.entered_ym, next.cleared_ym]);
  });
}

/* ---------- Clearing checks from a bank statement ---------- */
/** Month from a date string. Handles 2026-10-05, 10/05/2026, 10/05/26, 10-05-2026 and 10/05 (uses defYear). */
function dateToYM(str, defYear) {
  if (!str) return null;
  let m = /(\d{4})-(\d{1,2})-(\d{1,2})/.exec(str);
  if (m) return ymStr(+m[1], +m[2] - 1);
  m = /\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/.exec(str);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; if (+m[1] >= 1 && +m[1] <= 12) return ymStr(y, +m[1] - 1); }
  m = /\b(\d{1,2})\/(\d{1,2})\b/.exec(str);
  if (m && defYear && +m[1] >= 1 && +m[1] <= 12) return ymStr(defYear, +m[1] - 1);
  return null;
}
const CHECK_IN_TEXT = /\b(?:check|cheque|chk|ck)\b\.?\s*(?:#|no\.?|num(?:ber)?\.?)?\s*:?\s*#?\s*(\d{2,8})\b/i;
/**
 * Find check numbers in statement text: a CSV export (uses a check-number column if there is one,
 * otherwise the description) or plain lines copied from a statement.
 * Returns { found: [{ n, ym }], skipped } — ym is null when no date could be read.
 */
function extractStatementChecks(text, defYear) {
  const rows = parseCSV(text);
  const found = new Map();
  let skipped = 0;
  const add = (n, ym) => { if (n > 0 && !found.has(n)) found.set(n, ym); };
  const hdr = rows.length ? rows[0].map(h => h.trim().toLowerCase()) : [];
  const col = re => hdr.findIndex(h => re.test(h));
  const isHeader = rows.length > 1 && hdr.filter(h => /date|desc|memo|payee|amount|debit|credit|check|chk|num|ref|transaction/.test(h)).length >= 2;
  if (isHeader) {
    const cCheck = col(/^(check|chk|cheque)\s*(#|no\.?|num(ber)?)?$|check\s*(#|no|num)|^num(ber)?$|^no\.?$/);
    const cDate = col(/post(ed|ing)?\s*date|^date$|trans(action)?\s*date|date/);
    const descCols = hdr.map((h, i) => (/desc|memo|payee|detail|name|transaction|type/.test(h) ? i : -1)).filter(i => i >= 0);
    rows.slice(1).forEach(r => {
      const ym = cDate >= 0 ? dateToYM(r[cDate], defYear) : null;
      let n = null;
      if (cCheck >= 0) { const v = String(r[cCheck] || '').replace(/[^\d]/g, ''); if (v && v.length <= 8) n = parseInt(v, 10); }
      if (!n) for (const i of descCols) { const m = CHECK_IN_TEXT.exec(r[i] || ''); if (m) { n = parseInt(m[1], 10); break; } }
      if (n) add(n, ym); else skipped++;
    });
  } else {
    String(text).split(/\r?\n/).forEach(line => {
      if (!line.trim()) return;
      const m = CHECK_IN_TEXT.exec(line);
      if (m) add(parseInt(m[1], 10), dateToYM(line, defYear)); else skipped++;
    });
  }
  return { found: [...found].map(([n, ym]) => ({ n, ym })).sort((a, b) => a.n - b.n), skipped };
}
/** Which series a number belongs to: the one with the highest start at or below it (respecting end numbers). */
function seriesFor(seriesList, n) {
  let best = null;
  for (const s of seriesList) if (n >= s.start_no && (!s.end_no || n <= s.end_no) && (!best || s.start_no > best.start_no)) best = s;
  return best;
}
/** Plan for clearing found checks. Never downgrades; voided checks are only touched if clearVoids. */
function planStatementClear(seriesList, found, fallbackYm, clearVoids = false) {
  const out = { bySeries: new Map(), unmatched: [], noDate: 0 };
  const bucket = s => {
    if (!out.bySeries.has(s.id)) out.bySeries.set(s.id, { series: s, checks: getChecks(s.id), plan: [], toClear: [], notEntered: [], already: [], voided: [] });
    return out.bySeries.get(s.id);
  };
  for (const { n, ym } of found) {
    const s = seriesFor(seriesList, n);
    if (!s) { out.unmatched.push(n); continue; }
    const b = bucket(s), c = b.checks.get(n), month = ym || fallbackYm;
    if (!ym) out.noDate++;
    if (!c) { b.notEntered.push(n); b.plan.push({ n, from: null, next: { state: 'cleared', entered_ym: month, cleared_ym: month } }); }
    else if (c.state === 'entered') { b.toClear.push(n); b.plan.push({ n, from: 'entered', next: { state: 'cleared', entered_ym: c.entered_ym || month, cleared_ym: month } }); }
    else if (c.state === 'cleared') b.already.push(n);
    else if (c.state === 'void') {
      b.voided.push(n);
      if (clearVoids) b.plan.push({ n, from: 'void', next: { state: 'cleared', entered_ym: c.entered_ym || month, cleared_ym: month } });
    }
  }
  return out;
}

/* ---------- Syncing from a QuickBooks Online transaction report ----------
   Expected columns (QBO "Transaction List by Account"-style export):
   Distribution account, Transaction date, Transaction type, Num, Name, Description,
   Item split account, Amount, Balance, Cleared
   - Num (digits) is the check number
   - "Voided" in the description marks a voided check
   - Cleared: Uncleared = outstanding, Cleared = matched to the bank, Reconciled = reconciled */
function parseQboRegister(text) {
  const rows = parseCSV(text);
  const hi = rows.findIndex(r => { const h = r.map(c => c.trim().toLowerCase()); return h.includes('num') && h.some(c => /cleared|^clr$/.test(c)); });
  if (hi < 0) return { error: 'Couldn’t find the header row. The report needs at least “Num” and “Cleared” columns.', rows: [], accounts: [] };
  const hdr = rows[hi].map(c => c.trim().toLowerCase());
  const col = re => hdr.findIndex(h => re.test(h));
  const c = { acct: col(/distribution account|^account$/), date: col(/transaction date|^date$/), type: col(/transaction type|^type$/), num: hdr.indexOf('num'),
    name: col(/^name$/), desc: col(/description|memo/), clr: col(/cleared|^clr$/) };
  const out = [], accounts = new Set();
  let lastAcct = '';
  for (const r of rows.slice(hi + 1)) {
    const cell = i => (i >= 0 ? String(r[i] ?? '').trim() : '');
    if (c.acct >= 0 && cell(c.acct)) lastAcct = cell(c.acct);
    const desc = `${cell(c.desc)} ${cell(c.name)}`;
    let raw = cell(c.num).replace(/^#/, '');
    if (!raw) { const m = CHECK_IN_TEXT.exec(cell(c.desc)); if (m) raw = m[1]; }   // Num blank: fall back to "Check 1234" in the description
    if (!/^\d{1,8}$/.test(raw)) continue;                                  // not a check number (totals, blanks, refs)
    const clr = cell(c.clr).toLowerCase();
    const status = /^r(econciled)?$/.test(clr) ? 'reconciled' : /^c(leared)?$/.test(clr) ? 'cleared' : 'uncleared';
    const acct = cell(c.acct) || lastAcct;
    if (acct) accounts.add(acct);
    out.push({ acct, n: parseInt(raw, 10), ym: dateToYM(cell(c.date), null), type: cell(c.type), status, isVoid: /\bvoid(ed)?\b/i.test(desc) });
  }
  return { rows: out, accounts: [...accounts] };
}
/** Plan for bringing the register in line with QBO. QBO is the source for entered / void;
    a check already cleared in the tracker (e.g. from a statement) is never moved backwards. */
function planQboSync(seriesList, rows, clearedYm) {
  const byNum = new Map();
  rows.forEach(r => { const p = byNum.get(r.n); if (!p || r.isVoid) byNum.set(r.n, r); });   // a void entry wins over the original
  const out = { bySeries: new Map(), unmatched: [] };
  const bucket = s => {
    if (!out.bySeries.has(s.id)) out.bySeries.set(s.id, { series: s, checks: getChecks(s.id), plan: [], added: [], cleared: [], voided: [], unvoided: [], unchanged: [], conflicts: [] });
    return out.bySeries.get(s.id);
  };
  for (const r of [...byNum.values()].sort((a, b) => a.n - b.n)) {
    const s = seriesFor(seriesList, r.n);
    if (!s) { out.unmatched.push(r.n); continue; }
    const b = bucket(s), c = b.checks.get(r.n), ym = r.ym || clearedYm;
    const push = (list, next) => { list.push(r.n); b.plan.push({ n: r.n, from: c ? c.state : null, next }); };
    if (r.isVoid) {
      if (c && c.state === 'void') b.unchanged.push(r.n);
      else if (c && c.state === 'cleared') b.conflicts.push({ n: r.n, why: 'void in QBO but cleared in the tracker' });
      else push(b.voided, { state: 'void', entered_ym: (c && c.entered_ym) || ym, cleared_ym: null });
    } else if (r.status === 'uncleared') {
      if (!c) push(b.added, { state: 'entered', entered_ym: ym, cleared_ym: null });
      else if (c.state === 'entered') b.unchanged.push(r.n);
      else if (c.state === 'void') push(b.unvoided, { state: 'entered', entered_ym: c.entered_ym || ym, cleared_ym: null });
      else b.conflicts.push({ n: r.n, why: 'cleared in the tracker but uncleared in QBO' });
    } else {                                                                 // cleared or reconciled in QBO
      if (c && c.state === 'cleared') b.unchanged.push(r.n);
      else push(b.cleared, { state: 'cleared', entered_ym: (c && c.state !== 'void' && c.entered_ym) || ym, cleared_ym: clearedYm });
    }
  }
  return out;
}

/* =====================================================================
   Payroll: model helpers
   ===================================================================== */
function getPayrollSetup(clientId) { return one('SELECT * FROM payroll_setup WHERE client_id = ?', [clientId]); }
/** All pay dates (YYYY-MM-DD) in a year for a weekly payroll. */
/** First pay date that counts: the later of payroll's own start date and the client's tracking start. */
function payStart(setup) {
  const cs = clientStart(setup.client_id);
  return [setup.start_date, cs ? `${cs}-01` : null].filter(Boolean).sort().pop() || null;
}
function payDates(setup, year) {
  const out = [], start = payStart(setup);
  const d = new Date(year, 0, 1);
  while (d.getDay() !== setup.pay_weekday) d.setDate(d.getDate() + 1);
  for (; d.getFullYear() === year; d.setDate(d.getDate() + 7)) {
    const iso = isoDate(d);
    if (!start || iso >= start) out.push(iso);
  }
  return out;
}
/** Is a 941 / NYS-45 expected for this quarter? Not if marked "not required" or the quarter ended before payroll started. */
function quarterApplies(setup, year, qn, row) {
  if (row && row.skipped) return false;
  const start = setup && payStart(setup);
  return !start || start <= isoDate(new Date(year, qn * 3, 0));
}
function quarterNaReason(setup, year, qn, row) {
  if (row && row.skipped) return 'Marked not required';
  return `Before payroll started (${fmtShort(parseISO(payStart(setup)))}, ${payStart(setup).slice(0, 4)})`;
}
const w3Applies = (setup, cid, year) => getQuarters(cid, year).some((r, i) => quarterApplies(setup, year, i + 1, r));
function payRunMap(clientId, year) {
  const m = new Map();
  q('SELECT * FROM payroll_runs WHERE client_id = ? AND pay_date LIKE ?', [clientId, `${year}-%`]).forEach(r => m.set(r.pay_date, r));
  return m;
}
const runStatus = (map, d) => (map.get(d) || { status: 'not_received' }).status;
const PAY_GRACE_DAYS = 7;
function runOverdue(map, d) {
  if (runStatus(map, d) !== 'not_received') return false;
  const dt = parseISO(d); dt.setDate(dt.getDate() + PAY_GRACE_DAYS + 1);
  return new Date() > dt;
}
/** 941 / NYS-45 are due the last day of the month after the quarter; flagged two weeks after that. */
function quarterDue(year, qn) { return new Date(year, qn * 3 + 1, 0); }
function quarterOverdue(year, qn, row) {
  if (row && row.f941 && row.nys45) return false;
  const d = quarterDue(year, qn); d.setDate(d.getDate() + 14);
  return new Date() > d;
}
const quarterEnded = (year, qn) => new Date() > new Date(year, qn * 3, 0, 23, 59);
function getQuarters(clientId, year) {
  const rows = q('SELECT * FROM payroll_quarters WHERE client_id = ? AND year = ?', [clientId, year]);
  return [1, 2, 3, 4].map(n => rows.find(r => r.quarter === n) || { client_id: clientId, year, quarter: n, f941: 0, nys45: 0, tied: 0, wages_941: null, wages_books: null, note: '', skipped: 0 });
}
function getPayYear(clientId, year) {
  return one('SELECT * FROM payroll_years WHERE client_id = ? AND year = ?', [clientId, year]) || { client_id: clientId, year, w3: 0, w3_tied: 0, note: '' };
}
function setQuarter(clientId, year, quarter, patch) {
  const n = { ...getQuarters(clientId, year)[quarter - 1], ...patch };
  run(`INSERT INTO payroll_quarters (client_id, year, quarter, f941, nys45, tied, wages_941, wages_books, note, skipped) VALUES (?,?,?,?,?,?,?,?,?,?)
       ON CONFLICT(client_id, year, quarter) DO UPDATE SET f941 = excluded.f941, nys45 = excluded.nys45, tied = excluded.tied,
       wages_941 = excluded.wages_941, wages_books = excluded.wages_books, note = excluded.note, skipped = excluded.skipped`,
    [clientId, year, quarter, n.f941 ? 1 : 0, n.nys45 ? 1 : 0, n.tied ? 1 : 0, n.wages_941, n.wages_books, n.note || '', n.skipped ? 1 : 0]);
}
function setPayYear(clientId, year, patch) {
  const n = { ...getPayYear(clientId, year), ...patch };
  run(`INSERT INTO payroll_years (client_id, year, w3, w3_tied, note) VALUES (?,?,?,?,?)
       ON CONFLICT(client_id, year) DO UPDATE SET w3 = excluded.w3, w3_tied = excluded.w3_tied, note = excluded.note`,
    [clientId, year, n.w3 ? 1 : 0, n.w3_tied ? 1 : 0, n.note || '']);
}
function setRun(clientId, date, status) {
  if (status === 'not_received') run('DELETE FROM payroll_runs WHERE client_id = ? AND pay_date = ?', [clientId, date]);
  else run(`INSERT INTO payroll_runs (client_id, pay_date, status, updated_at) VALUES (?,?,?, datetime('now'))
            ON CONFLICT(client_id, pay_date) DO UPDATE SET status = excluded.status, updated_at = excluded.updated_at`, [clientId, date, status]);
}
const w3Overdue = (year, py) => !py.w3 && new Date() > new Date(year + 1, 1, 1);

function payrollStats(clientId, year) {
  const setup = getPayrollSetup(clientId);
  const s = { enabled: !!(setup && setup.enabled), total: 0, done: 0, overdue: 0, issues: 0, quartersTied: 0, quartersDue: 0 };
  if (!s.enabled) return s;
  const map = payRunMap(clientId, year);
  const ytd = progressMode() === 'ytd';
  const today = todayISO();
  payDates(setup, year).forEach(d => {
    if (runOverdue(map, d)) s.overdue++;
    if (ytd && d > today) return;
    if (runStatus(map, d) === 'none') return;     // no payroll that week
    s.total++;
    if (payDone(runStatus(map, d))) s.done++;
  });
  getQuarters(clientId, year).forEach((row, i) => {
    const qn = i + 1;
    if (!quarterEnded(year, qn) || !quarterApplies(setup, year, qn, row)) return;
    s.quartersDue++;
    if (row.tied) s.quartersTied++;
    if (quarterOverdue(year, qn, row)) s.overdue++;
    if (row.wages_941 != null && row.wages_books != null && row.wages_941 !== row.wages_books) s.issues++;
  });
  if (w3Applies(setup, clientId, year) && w3Overdue(year, getPayYear(clientId, year))) s.overdue++;
  return s;
}

/** Totals for sidebar/overview badges: accounts + payroll */
function clientStats(clientId, map, year) {
  const accs = q('SELECT * FROM accounts WHERE client_id = ?', [clientId]);
  const s = sumStats(accs.map(a => accountStats(a, map, year)));
  const p = payrollStats(clientId, year);
  s.overdue += p.overdue; s.issues += p.issues;
  return s;
}

  const recPct = (s.rec / s.total) * 100;
  const readyPct = ((s.ready || 0) / s.total) * 100;
  return `<span class="prog" title="${s.rec} of ${s.total} ${unit} done${s.ready ? ` · ${s.ready} ready to reconcile` : ''}">
    <span class="prog-track ${size}">
      <span class="prog-rec" style="width:${recPct.toFixed(2)}%"></span>
      <span class="prog-ready" style="left:${recPct.toFixed(2)}%;width:${readyPct.toFixed(2)}%"></span>
    </span>
    <span class="prog-label"><b>${s.rec}/${s.total}</b> · ${Math.round(recPct)}%</span>

function recCellState(acc, p) {
  if (p.reconciled) {
    const on = p.reconciled_on ? ` on ${p.reconciled_on}` : '';
    if (docsComplete(acc, p)) return ['rec-done', '✓ Rec’d', `Reconciled${on}. Fully documented.`];
    if (docsEntered(acc, p)) return ['rec-scan', '⚠ Rec’d', `Reconciled${on}, but a document still needs scanning.`];
    return ['rec-ghost', '⚠ Rec’d', `Reconciled${on}, but ${acc.has_gl ? "the statement or GL isn't" : "the statement isn't"} entered!`];
  }
  if (docsEntered(acc, p)) return ['rec-ready', 'Ready', 'Everything is entered. Click to mark reconciled.'];
  if (docsAny(acc, p)) return ['rec-pending', 'Pending', 'Waiting on remaining entry.'];
  return ['rec-blocked', '—', 'Nothing received yet.'];
}
function inactiveWhy(acc, y, m) {
  const k = ymKey(y, m), cs = parseYM(clientStart(acc.client_id));
  if (cs != null && k < cs) return `Before this client's tracking start (${fmtYM(clientStart(acc.client_id))})`;
  if (acc.opened && k < parseYM(acc.opened)) return `Before this account opened (${fmtYM(acc.opened)})`;
  return `After this account closed (${fmtYM(acc.closed)})`;
}
function statusSelect(accId, m, field, val, extraTitle = '') {
  return `<select class="st st-${val}" data-action="status" data-acc="${accId}" data-m="${m}" data-field="${field}" title="${esc(statusLabel(val) + extraTitle)}">
    ${STATUSES.map(s => `<option value="${s.v}" ${s.v === val ? 'selected' : ''}>${s.short}</option>`).join('')}
  </select>`;
}

  const cur = y === TODAY_YEAR ? TODAY_MONTH : -1;

  const meta = [acc.institution, acc.last4 ? `••${acc.last4}` : '', acc.closing_day ? `closes on the ${ordinal(acc.closing_day)}` : '',
    acc.opened ? `from ${fmtYM(acc.opened)}` : '', acc.closed ? `closed ${fmtYM(acc.closed)}` : '', acc.has_gl ? '' : 'no GL'].filter(Boolean).join(' · ');
  const anyActive = MONTHS.some((_, m) => isActiveMonth(acc, y, m));

  let grid = `<div class="acc-grid"><div class="rl mh"><span title="Click a month for balances and notes">Month ▸ details</span></div>`;
  for (let m = 0; m < 12; m++) {

    const b = active ? balanceInfo(acc, map, m) : null;
    const label = acc.closing_day ? `${MONTHS[m]} ${closeDay(acc, y, m)}` : MONTHS[m];
    let tip = `Statement period ${periodRange(acc, y, m)}. Click for balances & notes.`;
    let ye = '';
    if (m === 11 && midMonthClose(acc)) { tip += `\nDec ${closeDay(acc, y, 11) + 1}–31 activity is on the January ${y + 1} statement.`; ye = '<span class="mh-ye">↪</span>'; }

    grid += `<div class="mh${today(m)}">${active ? `<button class="mh-btn" data-action="month" data-acc="${acc.id}" data-m="${m}" title="${esc(tip)}">${label}${dot}${ye}</button>` : label}</div>`;
  }
  const rows = [['stmt_status', `📄 ${GROUPS[grp].stmtLabel}`]];
  if (acc.has_gl) rows.push(['gl_status', '📖 General Ledger']);
  rows.forEach(([field, label]) => {
    grid += `<div class="rl">${label}</div>`;

      grid += `<div class="${today(m).trim()}${od ? ' od' : ''}">${statusSelect(acc.id, m, field, p[field], extra)}</div>`;

/* =====================================================================
   SQLite engine loader
   Emscripten (which sql.js is built with) works out where its extra files live from the
   page/script URL. On a double-clicked page that resolves to the page's own file:// URL,
   which Chrome refuses to load ("Unsafe attempt to load URL … file: URLs are treated as
   unique security origins") and startup stalls. So we never let it guess: every file it
   asks for gets an absolute https URL, and the WebAssembly binary is fetched by us and
   handed over directly.
   ===================================================================== */
async function loadEngine() {
  const log = [];
  const status = msg => { $('main').innerHTML = `<div class="empty">${esc(msg)}</div>`; };
  const startWith = (base, extra = {}) => new Promise((res, rej) => {
    initSqlJs({
      ...extra,
      locateFile: f => { console.info('sql.js asked for', f); return base + f; },
      onAbort: what => rej(new Error('engine aborted: ' + what)),
      printErr: t => console.warn('sql.js:', t)
    }).then(res, rej);
  });
  const forget = () => { try { delete window.initSqlJs; } catch { window.initSqlJs = undefined; } };

  // 1) WebAssembly build: the server's cached copy first (when served by app.py), then the CDNs.
  const wasmBases = /^https?:$/.test(location.protocol) ? [new URL('vendor/', location.href).href, ...SQLJS_CDNS] : SQLJS_CDNS;
  for (const base of wasmBases) {
    const host = base.startsWith(location.origin) ? 'this server' : new URL(base).host;
    try {
      forget();
      status(`Loading database engine from ${host}…`);
      await withTimeout(loadScript(base + 'sql-wasm.js'), 12000, `${host} script`);
      status(`Downloading database engine from ${host}…`);
      const resp = await withTimeout(fetch(base + 'sql-wasm.wasm'), 15000, `${host} binary`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const wasmBinary = await resp.arrayBuffer();
      status('Starting database engine…');
      return await withTimeout(startWith(base, { wasmBinary }), 15000, 'starting engine');
    } catch (e) { log.push(`WebAssembly via ${host}: ${e.message || e}`); console.warn(log[log.length - 1]); }
  }
  // 2) Pure-JavaScript build: a local sql-asm.js next to this page first, then the CDNs.
  const asmSources = [['local sql-asm.js', 'sql-asm.js'], ...(/^https?:$/.test(location.protocol) ? [['this server', 'vendor/sql-asm.js']] : []), ...SQLJS_CDNS.map(b => [new URL(b).host, b + 'sql-asm.js'])];
  for (const [name, src] of asmSources) {
    try {
      forget();
      status(`Loading database engine (${name})…`);
      await withTimeout(loadScript(src), 12000, `${name} script`);
      status('Starting database engine (JavaScript build)…');
      return await withTimeout(startWith(SQLJS_CDNS[0]), 25000, 'starting engine');
    } catch (e) { log.push(`JavaScript build via ${name}: ${e.message || e}`); console.warn(log[log.length - 1]); }
  }
  throw new Error(log.join('\n'));
}

async function boot() {
  applyTheme(LS.get('rt.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  setChrome(false);
  try { SQL = await loadEngine(); }
  catch (e) {
    $('main').innerHTML = `<div class="welcome"><h2>Couldn't start the database engine</h2>
      <p class="muted">The tracker uses sql.js (SQLite for the browser). None of the ways of starting it worked in this browser.</p>
      <p>Please copy the details below and send them over.</p>
      <pre class="muted" style="white-space:pre-wrap">${esc(e.message || String(e))}</pre></div>`;
    return;
  }
  const status = msg => { $('main').innerHTML = `<div class="empty">${esc(msg)}</div>`; };
  status('Checking for a tracker server…');
  if (await serverInfo()) {
    try { status('Loading database from the server…'); return await serverStart(); }
    catch (e) {
      $('main').innerHTML = `<div class="welcome"><h2>Couldn't load the database from the server</h2><pre class="muted" style="white-space:pre-wrap">${esc(e.message || String(e))}</pre><p class="muted">Reload the page to try again.</p></div>`;
      return;
    }
  }
  // Escape hatch: open the page with #reset to forget the remembered file.
  if (location.hash === '#reset') { await idbDel('fileHandle'); history.replaceState(null, '', location.pathname); }
  status('Looking for the database file you used last…');
  const handle = fsSupported ? await idbGet('fileHandle') : null;
  if (handle) {
    try {
      status(`Reopening ${handle.name}…`);
      // A remembered file on a network share can hang here; never wait more than a few seconds.
      const perm = await withTimeout(handle.queryPermission({ mode: 'readwrite' }), 5000, 'checking file permission');
      if (perm === 'granted') {
        const file = await withTimeout(handle.getFile(), 10000, `opening ${handle.name}`);
        const bytes = new Uint8Array(await withTimeout(file.arrayBuffer(), 15000, `reading ${handle.name}`));
        openDbFromBytes(bytes);
        await attachFile(handle);
        return start();
      }
    } catch (e) {
      console.warn('Could not reopen the remembered file:', e);
      await idbDel('fileHandle');
      return showWelcome(`Couldn't reopen ${handle.name} automatically (${e.message || e}). Use “Open an existing database file” to pick it again.`);
    }
    return showWelcome();
  }
  const cache = await idbGet('dbCache');
  if (cache && !fsSupported) {
    openDbFromBytes(cache);
    storageMode = 'browser';
    return start();
  }
  showWelcome();
}

function applyFill(accId) {
  const a = one('SELECT * FROM accounts WHERE id = ?', [accId]);
  let from = +$('bFrom').value, to = +$('bTo').value;
  if (from > to) [from, to] = [to, from];
  const stmtOn = $('bStmtOn').checked, glOn = !!a.has_gl && $('bGlOn').checked;
  const stmt = $('bStmt').value, gl = a.has_gl ? $('bGl').value : null, rec = $('bRec').checked, upOnly = $('bUpOnly').checked;
  const map = periodMap(ui.year, a.client_id);
  const mode = $('bMode').value;
  closeModal();
  if (mode !== 'status') {
    return mutate(`${a.name} ${MONTHS[from]}–${MONTHS[to]}: ${mode === 'skip' ? 'no activity' : 'tracked again'}`, () => {
      for (let m = from; m <= to; m++) if (isActiveMonth(a, ui.year, m)) setPeriod(accId, ui.year, m, { skipped: mode === 'skip' ? 1 : 0 });
    });
  }
  mutate(`Bulk update ${a.name} (${MONTHS[from]}–${MONTHS[to]})`, () => {
    for (let m = from; m <= to; m++) {
      if (!isActiveMonth(a, ui.year, m)) continue;
      const p = getP(map, accId, m);
      if (p.skipped) continue;
      const patch = {};
      if (stmtOn && (!upOnly || STATUS_RANK[stmt] > STATUS_RANK[p.stmt_status])) patch.stmt_status = stmt;
      if (glOn && (!upOnly || STATUS_RANK[gl] > STATUS_RANK[p.gl_status])) patch.gl_status = gl;
      if (rec && !p.reconciled) patch.reconciled = 1;
      if (Object.keys(patch).length) setPeriod(accId, ui.year, m, patch);
    }
  });
}

  const verbs = { entered: 'entered', cleared: `cleared in ${fmtYM(ym)}`, void: 'void', reset: 'blank' };
  const voidingCleared = op === 'void' ? plan.filter(p => p.from === 'cleared').length : 0;
  if (voidingCleared && !confirm(`${voidingCleared} of these checks are marked cleared. Void them anyway?`)) return;
  if (plan.length > 25 && !confirm(`Mark ${plan.length} checks ${verbs[op]}?`)) return;
  ui.modal.input = '';
  mutate(`${s.label}: ${plan.length} check(s) ${verbs[op]}`, () => applyCheckPlan(s.id, plan));
  toast(`${plan.length} check${plan.length > 1 ? 's' : ''} marked ${verbs[op]}.`, 'Undo', undo, 6000);
}
function checkCycle(n) {
  const st = ui.modal;
  const c = getChecks(st.seriesId).get(n);
  const ym = ($('chkMonth') && $('chkMonth').value) || TODAY_YM;
  const order = [null, 'entered', 'cleared', 'void'];
  const next = order[(order.indexOf(c ? c.state : null) + 1) % order.length];
  const plan = planCheckAction(c ? new Map([[n, c]]) : new Map(), [n], next || 'reset', ym);
  if (plan.length) mutate(`Check #${n} → ${next ? CHECK_STATES[next] : 'blank'}`, () => applyCheckPlan(st.seriesId, plan));
}

/** Built-in template, overlaid with saved defaults, then (single client) that client's saved texts. */
function reportConfig(key, client = null) {
  const base = JSON.parse(JSON.stringify(REPORT_TEMPLATES[key]));
  const saved = jsonSetting(`report_tpl:${key}`, null);
  const cfg = { ...base, headings: {}, ...(saved || {}) };
  cfg.sections = { ...base.sections, ...(saved && saved.sections) };
  cfg.opts = { ...base.opts, ...(saved && saved.opts) };
  cfg.headings = { ...(saved && saved.headings) };
  if (client) {
    const cp = clientReportPrefs(client);
    if (cp.texts && cp.texts[key]) Object.assign(cfg, cp.texts[key]);

  return cfg;
